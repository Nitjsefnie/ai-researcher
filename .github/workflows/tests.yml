name: tests

# The suite that guards the published page. Its browser file,
# tests/test_browser.py, drives the built HTML in a real headless Chromium
# through playwright.
#
# The suite runs through Nitjsefnie-Actions/test-ratchet: `plan` splits the
# test files into shards balanced by recorded run time, and `test` runs one
# shard per job with coverage measured, over a 3-OS x 2-Python matrix that
# buys portability coverage of the tooling itself. The `report` job that
# merges the shards' coverage, gates it against .github/ci-thresholds.json
# and commits the raised records is a job of ci-gate.yml, the caller: a
# workflow_call callee cannot read an environment secret, and the push key
# lives in the main-push environment.
#
# The ubuntu-latest / Python 3.15 cell is the one report gates, and the only
# one that runs tests/test_browser.py: it installs playwright's Chromium, and
# the browser harness writes the V8 coverage of the page's inline script into
# the directory the action names, so that cell measures the JavaScript floor
# beside the Python one. The browser suite stays OUT of the other cells
# because (a) playwright's --with-deps browser install is Ubuntu-only, so
# cross-OS browser steps would need per-OS install recipes for near-zero
# signal, and (b) the page under test is OS-independent text (HTML/JS built
# by build.py), so a second OS adds no behavioral coverage. `budgets` runs
# the instruction budgets and the ratchet-document guard, which the action
# does not cover. `page` is the committed-page check: the source-commit
# stamp is set only on the refresh path, so a page committed by hand could go
# out stamp-less and the republish run would publish it — that job refuses a
# committed page lacking the stamp or differing from its own stamp-less
# rebuild. `page-rankings` refuses a committed rankings page that differs from
# its rebuild of HEAD's history.

on:
  workflow_call:

# The push and pull_request triggers, and their paths-ignore deny-list
# (`**/*.md` / LICENSE / .gitignore), live in ci-gate.yml: a trigger filter
# cannot report, so a required-check ruleset could never go green on a
# documentation-only change. ci-gate classifies the changed paths and
# conditions this leg on the result; this file keeps workflow_call (the
# leg), its permissions block and its concurrency group.
#
# NO `workflow_dispatch`, deliberately. The cache-poisoning query behind
# code-scanning alert #26 (actions/cache-poisoning/poisonable-step) requires an
# externally triggerable event with default-branch cache-write access
# and named workflow_dispatch in the alert message, so re-adding it
# re-arms the alert, and tests/test_ci_context_separation.py refuses it
# by name. Running the suite on a ref no push or pull request covers has no
# route here: main's push trigger carries every merge, and a finished run
# re-runs from its own page.

# Least privilege: this job only reads the tree. Without an explicit block it
# inherits the repository default, which can be read/write for the whole token.
permissions:
  contents: read

concurrency:
  # One group per PR, per push SHA, or per ref for standalone runs.
  group: tests-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        uses: Nitjsefnie-Actions/test-ratchet/plan@7845a0154a83a454ec9045536a067c61fc3db4cb # v2.2.0
        with:
          tests: tests/test_*.py
          times: .github/test-times.json
          shards: 2

  test:
    name: pytest (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.shard }})
    needs: plan
    runs-on: ${{ matrix.os }}
    # Per-job ceiling: a hung shard fails in 30 minutes instead of holding
    # GitHub's 6-hour default.
    timeout-minutes: 30
    defaults:
      run:
        # One shell on every OS keeps the run blocks identical syntax, and it
        # has to be bash — the windows default (pwsh) would need different
        # syntax. The commands use bare `python`, never `python3`: on windows
        # runners the WindowsApps `python3` stub hijacks PATH, while `python`
        # resolves to the setup-python install on all three OSes.
        shell: bash

    strategy:
      fail-fast: false
      # 3.14 is the floor: the pinned test tools (pytest, playwright,
      # coverage, pyyaml) all declare requires_python at or below it.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.14", "3.15"]
        shard: ${{ fromJSON(needs.plan.outputs.matrix).shard }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency pulls
          # in — reuse it.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          # There is no requirements.txt here (the runtime is pure stdlib), so
          # the cache must be keyed off the pins that do exist or setup-python
          # fails the job looking for one.
          cache-dependency-path: requirements-*.txt

      - name: Install the test toolchain
        # There is deliberately no `pip install --upgrade pip` here: the
        # runner's stock pip installs the pinned manifest, so the unreviewed
        # upgrade would be the one unpinned install in the job.
        run: |
          python scripts/ci/download.py --run python -m pip install -r requirements-test.txt

      # PR runs restore main's debs; they never save PR-authored caches.
      - name: Cache Chromium dependency debs
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.15'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ai-researcher-playwright-debs
          key: chromium-debs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: chromium-debs-${{ runner.os }}-

      - name: Install Chromium for playwright
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.15'
        # The browser binary is not a pip package, and playwright's own
        # installer performs no integrity check: browsers.json publishes no
        # digest and the installer never hashes a byte, so a bare install
        # executes whatever the CDN hands over. scripts/ci/install_chromium.py
        # verifies every archive against a committed sha256 first, pre-seeds
        # the browsers directory so playwright's install has nothing left to
        # download, and fails the run if anything was re-downloaded anyway.
        # The verification matters because the browser produces the V8
        # coverage dump that sets the JavaScript floor.
        # The --with-deps step inside the script still apt-installs the
        # shared libraries headless Chromium needs on a bare runner; without
        # them the launch fails with a missing-library error that reads
        # like a test failure.
        run: python3 scripts/ci/install_chromium.py

      # Both run steps measure `source: .`; setup.cfg omits tests/*. They run
      # serially (`-n 0`), as the suite always has, since its browser and
      # flock tests share state across one process.
      - name: Run the gated cell's tests
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.15'
        uses: Nitjsefnie-Actions/test-ratchet/run@7845a0154a83a454ec9045536a067c61fc3db4cb # v2.2.0
        with:
          runner: pytest
          tests: tests/test_*.py
          times: .github/test-times.json
          cell: ${{ matrix.os }}-py${{ matrix.python }}
          shard: ${{ matrix.shard }}
          source: .
          args: -n 0
          # The JavaScript floor counts the code lines of the page's inline
          # script. The fixture builds differ from the committed page only in
          # the `const DATA = ...;` line and the lines carrying the capture date.
          javascript: out/frontier-models.html
          javascript-code-only: 'true'
          javascript-data-lines: 'const DATA = .*;|.*captured[ :"]+\d{4}-\d\d-\d\d.*'

      - name: Run the portability cells' tests
        # Every test file but tests/test_browser.py.
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.15'
        uses: Nitjsefnie-Actions/test-ratchet/run@7845a0154a83a454ec9045536a067c61fc3db4cb # v2.2.0
        with:
          runner: pytest
          tests: |
            tests/test_[!b]*.py
            tests/test_b[!r]*.py
            tests/test_browser_*.py
          times: .github/test-times.json
          cell: ${{ matrix.os }}-py${{ matrix.python }}
          shard: ${{ matrix.shard }}
          source: .
          args: -n 0

  # --- The ratchets test-ratchet does not cover ---------------------------
  budgets:
    runs-on: ubuntu-latest
    # The four callgrind runs run 20-50x slower than the targets alone.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          # Pure stdlib: nothing to install or cache.

      - name: Cache valgrind dependency debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ai-researcher-valgrind-debs
          key: valgrind-debs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: valgrind-debs-${{ runner.os }}-

      - name: Instruction budgets gate
        # The pipeline's CPU ratchet (issue #110): build.py, capture_gate.py
        # and diff_aa.py are measured under valgrind callgrind on the
        # COMMITTED fixture capture (tests/fixtures/pipeline/) and held
        # against the integer maxima in .github/instruction-budgets.json --
        # never against the live data/ captures, so the budgets stay
        # invariant to capture size. Tighten-only, like every ratchet here:
        # the "Ratchet documents" step below refuses a PR that raises a
        # budget, and there is no automated raise.
        #
        # ONE JOB ONLY. The measurement needs valgrind (installed below
        # when the runner lacks it) and four callgrind runs, which the test
        # matrix neither installs nor has the minutes to spare for.
        #
        # The gate ALWAYS prints its measured counts: the step summary is
        # where the next tighten-only PR reads the numbers to calibrate
        # against.
        run: |
          python3 scripts/ci/install_valgrind.py
          set -o pipefail
          python3 scripts/ci/instruction_budgets.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Ratchet documents
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        # Nobody may relax the budget documents (.github/perf-budgets.json
        # and .github/instruction-budgets.json): every budget may only fall.
        # The guard runs on pull requests and on pushes, so a direct push to
        # main cannot ship a raised budget either (issue #53). The coverage
        # records are guarded by the report job's records-only-rise.
        #
        # On a pull request the merge ref merges the head into the base,
        # so HEAD^1 is the base tip and HEAD^2 the head, and the check
        # compares the document at their merge base with the head's copy
        # — never the working tree. On a push, AI_RESEARCHER_BEFORE is the previous tip
        # of main and HEAD the new one. The history is still shallow by
        # the time this runs, and a shallow history can make git
        # merge-base return a wrong base without erroring, so the step
        # completes the history of both sides first. A branch-creation
        # push carries the all-zero AI_RESEARCHER_BEFORE — nothing to compare against.
        #
        # Both branches pass --allow-declared-raises (issues #120 and
        # #133): a deliberate budget raise lands as its own commit whose
        # message carries one "Budget-Raise: <document> <key> <from> ->
        # <to>" line per raised leaf, naming the exact values the diff
        # carries, and the lines count only on commits touching nothing
        # outside the two budget documents — a raise cannot ride feature
        # work onto main, on a push or on a pull request. The routes
        # differ in the window's guarantee: the push branch requires base
        # to be an ancestor of head (a fast-forward of main), while the
        # PR branch's HEAD^1..HEAD^2 is the pull request's own commits by
        # construction — --route pr tells the guard which shape it is in.
        # Merge shape matters: a rebase merge keeps the raise commit's
        # lines; a squash merge may replace them with the PR title
        # (GitHub's squash message can also prefill the commit's own
        # message), and a squash that drops them makes the raise refuse
        # on main's push. A rebase merge is the deterministic route.
        #
        # The pull-request branch fetches the event's merge commit, never
        # refs/pull/<number>/head: the PR-number refspec was the untrusted
        # source of code-scanning alert #27
        # (actions/untrusted-checkout/medium) and fed alert #26 — the
        # analyser reads a git fetch whose command or env names the PR
        # number as pulling the untrusted head — and fetching the merge
        # commit completes both sides at once. github.sha is trusted event
        # provenance, and a mutable PR-head refspec is not what the guard
        # compares: HEAD^1 and HEAD^2 are its only inputs. A fetch reruns on
        # exit 128 alone (issue #426), asking per attempt whether the history
        # is still shallow: --unshallow on a complete one exits 128 for good.
        env:
          AI_RESEARCHER_CI_SHA: ${{ github.sha }}
          AI_RESEARCHER_BEFORE: ${{ github.event.before }}
        run: |
          # shellcheck disable=SC2016  # bash -c expands its own script
          fetch_history() {
            python3 scripts/ci/download.py --run --retry-on 128 bash -c '
              [ "$(git rev-parse --is-shallow-repository)" = false ] || set -- --unshallow "$@"
              exec git fetch "$@"' fetch-history "$@"
          }
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            fetch_history origin "${AI_RESEARCHER_CI_SHA}"
            python3 scripts/ci/check_ratchets.py --allow-declared-raises --route pr HEAD^1 HEAD^2
          else
            if [ "${AI_RESEARCHER_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
              echo "branch creation: no previous main tip to compare against"
              exit 0
            fi
            fetch_history origin main "${AI_RESEARCHER_BEFORE}"
            python3 scripts/ci/check_ratchets.py --allow-declared-raises "${AI_RESEARCHER_BEFORE}" HEAD
          fi

  # --- The committed-page check -------------------------------------------
  # out/frontier-models.html gets its "Source commit <code>…
  # </code>" stamp only when AI_RESEARCHER_AA_SOURCE_COMMIT is set at build time, and only
  # refresh.yml sets it — so a page a pull request builds and commits by
  # hand goes out stamp-less, and the hourly republish run restores HEAD's
  # committed page byte for byte, stamp-less. This job refuses a committed
  # page that (i) lacks exactly one well-shaped source-commit stamp or
  # (ii) differs from a stamp-less rebuild of the same tree once build
  # provenance is masked. The check imports its masking from capture_gate,
  # so the two gates cannot disagree on what provenance is.
  page:
    runs-on: ubuntu-latest

    # Per-job ceiling, like every other job's: a hung check fails in 20
    # minutes instead of holding GitHub's 6-hour default.
    timeout-minutes: 20

    permissions:
      # The check only reads the tree and rebuilds into a temp dir under it.
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency pulls
          # in — reuse it.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          # No pip cache: the check is pure stdlib — nothing to install, so
          # nothing to key a cache off.
      - name: Check the committed page
        run: python3 scripts/ci/check_committed_page.py

  # The rankings page compares every byte against a rebuild of HEAD's history.
  page-rankings:
    runs-on: ubuntu-latest

    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Rebuild walks the three trending lists' history in data/; a
          # depth-1 checkout omits the earlier ranking snapshots.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          # Pure stdlib, like the frontier check: nothing to install or cache.
      - name: Check the committed rankings page
        run: python3 scripts/ci/check_committed_rankings_page.py
