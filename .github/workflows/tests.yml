name: tests

# The suite that guards the published page. Its browser file,
# tests/test_browser.py, drives the built HTML in a real headless Chromium
# through playwright.
#
# FOUR JOBS, split on purpose. `suites` is a 3-OS x 3-Python matrix running the
# non-browser suite on every cell — that is what buys portability coverage of
# the tooling itself. `coverage` is the dedicated Linux job: the full suite
# (browser included) under the coverage ratchet, and it holds a read-only
# token: it installs unhashed third-party dependencies and downloads a
# browser, so the automated raise leaves the job as an artifact instead of
# riding a write token. The browser suite stays OUT
# of the matrix because (a) playwright's --with-deps browser install is
# Ubuntu-only, so cross-OS browser steps would need per-OS install recipes for
# near-zero signal, and (b) the page under test is OS-independent text (HTML/
# JS built by build.py), so a second OS adds no behavioral coverage the matrix
# misses. The coverage job installs playwright and Chromium; the matrix job
# does not. That asymmetry is deliberate. The raise's push half left this
# file for the top-level `ratchet-push` workflow (issue #133 part 2b): a
# workflow_call callee cannot read an environment secret, and the deploy
# key the push now authenticates with lives in one. The coverage job still
# stages the raise as the `ratchet-data` artifact for that workflow. `page`
# is the committed-page check
# (issue #105): the source-commit stamp is set only on the refresh path, so a
# page a PR commits by hand could go out stamp-less and the #94 heal run
# would publish it — that job refuses a committed page lacking the stamp or
# differing from its own stamp-less rebuild.
#
# A FOURTH job rides along on pull requests only. `diff-coverage` reports the
# coverage of the change's OWN added lines — informational, never a gate
# (issue #126) — and hands the rendered report to the `coverage comment`
# workflow, which holds `pull-requests: write` beside the claim action's job
# (issue #161, claim#153): no job that executes this tree ever carries a
# conversation-write token, and the two writers never check the tree out.
#
# THE RUNNER IS ALWAYS THE `-m` FORM — `python -m pytest`, which the coverage
# job spells `python3 -m pytest` — NOT `pytest`, AND
# NOT `unittest discover`. tests/ has no __init__.py and the tests `import
# build` from the repo root, so the root has to be on sys.path. Only the `-m`
# form puts the cwd there — the bare `pytest` binary collects the same files
# and every test errors on the import. `unittest discover -t .` refuses
# outright ("start directory is not importable"). pytest is the runner here
# purely because it tolerates that layout; nothing in the suite is written
# against pytest.

on:
  workflow_call:

# Trigger ownership moved to ci-gate.yml (issue #133): the push and
# pull_request triggers, and their paths-ignore deny-list
# (`**/*.md` / LICENSE / .gitignore), live there now — a trigger filter
# cannot report, so a required-check ruleset could never go green on a
# documentation-only change. ci-gate classifies the changed paths and
# conditions this leg on the result; this file keeps workflow_call (the
# leg), its permissions block and its concurrency group.
#
# NO `workflow_dispatch`, deliberately — the one trigger this workflow
# gives up (issue #180). The cache-poisoning query behind code-scanning
# alert #26 (actions/cache-poisoning/poisonable-step) requires an
# externally triggerable event with default-branch cache-write access
# and named workflow_dispatch in the alert message, so re-adding it
# re-arms the alert, and tests/test_ci_context_separation.py refuses it
# by name. What the trigger bought — running the suite on a ref no push
# or pull request covers — is no route at all here: main's push trigger
# carries every merge, and a finished run re-runs from its own page.

# Least privilege: this job only reads the tree. Without an explicit block it
# inherits the repository default, which can be read/write for the whole token.
permissions:
  contents: read

concurrency:
  # A push that supersedes an in-flight run for the same ref cancels it —
  # nothing is learned from CI for a commit that is already history.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- The portability matrix -------------------------------------------
  # The non-browser suite across ubuntu-latest, windows-latest and
  # macos-latest x Python 3.11/3.12/3.13. No playwright, no Chromium, no
  # coverage — those live in the `coverage` job below.
  suites:
    name: pytest (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Per-cell ceiling, matching the catalogue's tests.yml: a hung cell fails
    # in 20 minutes instead of holding GitHub's 6-hour default.
    timeout-minutes: 20
    defaults:
      run:
        # One shell on every OS keeps the run blocks identical syntax, and it
        # has to be bash — the windows default (pwsh) would need different
        # syntax. The commands use bare `python`, never `python3`: on windows
        # runners the WindowsApps `python3` stub hijacks PATH, while `python`
        # resolves to the setup-python install on all three OSes.
        shell: bash

    strategy:
      fail-fast: false
      # 3.11 is the floor: all three pinned test tools (pytest 9.1.1,
      # playwright 1.63.0, coverage 7.16.1) declare requires_python >=3.10,
      # and 3.11/3.12/3.13 is the catalogue's standard triple. The full suite
      # was measured green under 3.11 and 3.12 locally on Linux; CI runs 3.13
      # today.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency pulls
          # in — reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          # There is no requirements.txt here (the runtime is pure stdlib), so
          # the cache must be keyed off the pins that do exist or setup-python
          # fails the job looking for one.
          cache-dependency-path: requirements-*.txt

      - name: Install the test toolchain
        # There is deliberately no `pip install --upgrade pip` here: the
        # runner's stock pip installs the pinned manifest, so the unreviewed
        # upgrade would be the one unpinned install in the job (issue #141).
        run: |
          python -m pip install -r requirements-test.txt

      - name: Run tests
        # --ignore=tests/test_browser.py: the browser suite stays OUT of the
        # matrix and lives only in the `coverage` job below — --with-deps is
        # Ubuntu-only and the page under test is OS-independent text, so a
        # second OS adds nothing (see the header for the full reasoning).
        run: python -m pytest -q -ra --ignore=tests/test_browser.py

  # --- The dedicated Linux job for the browser suite ---------------------
  # The full suite (browser included) under the coverage ratchet. It
  # installs playwright and Chromium; the matrix job above does not — that
  # asymmetry is deliberate, see the header and the matrix job's --ignore
  # comment. One pytest run produces BOTH measurements: coverage.py counts
  # the Python statements, and the browser harness writes the V8 block
  # coverage of the page's inline script to JS_COVERAGE_OUT for
  # scripts/ci/js_coverage.py to fold into code-line coverage.
  coverage:
    runs-on: ubuntu-latest

    # Per-job ceiling, like the matrix cells' 20 above, sized up for what
    # this job carries that they do not: the Chromium install and the FULL
    # suite under coverage. A hung job fails in 30 minutes instead of
    # holding GitHub's 6-hour default.
    timeout-minutes: 30

    # Read-only, like every job here that runs code. This job installs
    # unhashed third-party dependencies and downloads a browser, so nothing
    # in it may hold a write token (issue #134): the ratchet raise leaves
    # the job as an artifact for the top-level `ratchet-push` workflow
    # (issue #133 part 2b), whose own gates decide whether it lands.
    permissions:
      contents: read

    env:
      # One absolute coverage data file for the outer run AND every measured
      # subprocess: a child collector parallel-suffixes it in place, so
      # concurrent children cannot clobber one another or the outer data.
      # Every coverage step below reads the same path, and the Coverage
      # summary step combines the sidecars before any report reads a total.
      COVERAGE_FILE: ${{ github.workspace }}/.coverage

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency pulls
          # in — reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          # There is no requirements.txt here (the runtime is pure stdlib), so
          # the cache must be keyed off the pins that do exist or setup-python
          # fails the job looking for one.
          cache-dependency-path: requirements-*.txt

      - name: Install the test toolchain
        id: install
        # There is deliberately no `pip install --upgrade pip` here: the
        # runner's stock pip installs the pinned manifest, so the unreviewed
        # upgrade would be the one unpinned install in the job (issue #141).
        run: |
          python3 -m pip install -r requirements-test.txt

      - name: Install Chromium for playwright
        # The browser binary is not a pip package, and playwright's own
        # installer performs no integrity check: browsers.json publishes no
        # digest and the installer never hashes a byte, so a bare install
        # executes whatever the CDN hands over. scripts/ci/install_chromium.py
        # verifies every archive against a committed sha256 first, pre-seeds
        # the browsers directory so playwright's install has nothing left to
        # download, and fails the run if anything was re-downloaded anyway.
        # The verification keeps its point under the artifact split (issue
        # #134): the browser produces the V8 coverage dump that sets the
        # JavaScript floor, and that floor crosses into the privileged
        # ratchet-push job inside the staged thresholds file.
        # The --with-deps step inside the script still apt-installs the
        # shared libraries headless Chromium needs on a bare runner; without
        # them the launch fails with a missing-library error that reads
        # like a test failure.
        run: python3 scripts/ci/install_chromium.py

      - name: Run tests
        id: pytest
        # Under coverage, and with the repo root as cwd — see the header.
        # JS_COVERAGE_OUT makes tests/test_browser.py record every page's V8
        # coverage and dump it on teardown; unset, the suite behaves exactly
        # as before.
        env:
          JS_COVERAGE_OUT: ${{ runner.temp }}/js-coverage.json
          # Measured subprocesses: the CLI contract tests launch the
          # patch-coverage reporter as a real child interpreter, which this
          # run's collector cannot trace, and the IMPLICIT .pth hook cannot
          # trace it either — the reporter constructs a second Coverage
          # object of its own (the statement analyzer), and a second
          # construction suppresses the hook's save. The CLI tests read
          # this variable and run the child under an explicit `coverage
          # run`, whose save survives; .github/coverage-children.rc bounds
          # what such a child records.
          COVERAGE_MEASURE_CHILDREN_RC: ${{ github.workspace }}/.github/coverage-children.rc
        run: |
          # --parallel-mode: the outer run writes a sidecar like every
          # measured child, because `coverage combine` REPLACES the data
          # file with the combined sidecars — it does not merge into an
          # existing one. A non-parallel outer run would be thrown away.
          python3 -m coverage run --parallel-mode --source=. \
            --omit='tests/*' -m pytest -q -ra

      - name: Coverage summary
        # Renders whether or not the gates below pass — a coverage regression
        # is only actionable if you can see WHICH file lost lines, and
        # re-reading a scrolled CI log to find that is exactly the friction
        # that gets a gate disabled. Python statement coverage and JavaScript
        # physical code-line coverage are separate metrics.
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' }}
        env:
          JS_COVERAGE_OUT: ${{ runner.temp }}/js-coverage.json
        run: |
          # Fold the measured subprocess sidecars into the outer run's data
          # FIRST, so every report and gate below reads one complete
          # measurement. A run that launched no measured child has no
          # sidecars, and `coverage combine` treats that as an error, so
          # the guard is load-bearing rather than cosmetic.
          ls .coverage.* >/dev/null 2>&1 && python3 -m coverage combine
          {
            echo '### Coverage'
            echo
            python3 -m coverage report --format=markdown --precision=1
            echo
            echo '### JavaScript coverage'
            echo
            python3 scripts/ci/js_coverage.py "$JS_COVERAGE_OUT"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -m coverage xml -o coverage.xml

      - name: Upload coverage.xml
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Coverage gate
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' }}
        # A RATCHET, not a target. The floor is committed data in
        # .github/ci-thresholds.json: seeded 1.5 points under the measured
        # coverage of the run that recorded it, so ordinary churn stays green
        # and a real regression goes red. On a push to main this workflow
        # raises the floor itself once coverage climbs more than the
        # hysteresis (1.5) above the recorded measured. CI never lowers the
        # floor: the automated raise is the only writer on main, and the
        # Ratchet documents step below refuses a pull request that relaxes
        # the document.
        #
        # SCRIPTS ARE COUNTED, and that is a deliberate reversal. They were
        # omitted while they were operator tooling a human ran and eyeballed.
        # That stopped being true when diff_aa.py started writing the commit
        # messages refresh.yml produces and publish_docs.py started talking to
        # the hub with a credential: nobody is watching either at 01:11 UTC.
        # Omitting them was measuring the half that a person checks anyway.
        #
        # Note what the number can and cannot speak to: what coverage counts
        # as statements in build.py is a small fraction of its size, because
        # most of its lines are HTML/JS/SVG string literals no line-coverage
        # number reaches. The browser tests are what actually exercise those.
        run: |
          floor="$(python3 scripts/ci/thresholds.py --coverage-floor python)"
          python3 -m coverage report "--fail-under=${floor}" --precision=1

      - name: JavaScript coverage gate
        id: jscov
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' }}
        # The front-end half of the same ratchet. The browser harness wrote
        # the V8 block coverage Chromium collected for the built page to
        # JS_COVERAGE_OUT; js_coverage.py attributes a record only when its
        # source is the page's single inline <script> and folds the rest of
        # what the browser compiled into an unattributed count that is never
        # scored. The floor is the committed javascript record, same rules
        # as python: seeded 1.5 under measured, never lowered, raised on
        # main by ratchet.py --language javascript.
        env:
          JS_COVERAGE_OUT: ${{ runner.temp }}/js-coverage.json
        run: |
          js_floor="$(python3 scripts/ci/thresholds.py \
            --coverage-floor javascript)"
          python3 scripts/ci/js_coverage.py "$JS_COVERAGE_OUT" \
            "--fail-under=${js_floor}" --format=total

      - name: Instruction budgets gate
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' }}
        # The pipeline's CPU ratchet (issue #110): build.py, capture_gate.py
        # and diff_aa.py are measured under valgrind callgrind on the
        # COMMITTED fixture capture (tests/fixtures/pipeline/) and held
        # against the integer maxima in .github/instruction-budgets.json --
        # never against the live data/ captures, so the budgets stay
        # invariant to capture size. Tighten-only, like every ratchet here:
        # the "Ratchet documents" step below refuses a PR that raises a
        # budget, and there is no automated raise.
        #
        # COVERAGE JOB ONLY. The measurement needs valgrind (installed
        # below when the runner lacks it) and four callgrind runs, which
        # run 20-50x slower than the targets alone; the 3x3 matrix neither
        # installs valgrind nor has the minutes to spare, and its cells'
        # 20-minute ceiling is standing. This job already carries the
        # dedicated tooling and the 30-minute ceiling.
        #
        # The gate ALWAYS prints its measured counts: the step summary is
        # where the next tighten-only PR reads the numbers to calibrate
        # against.
        run: |
          if ! command -v valgrind >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends valgrind
          fi
          set -o pipefail
          python3 scripts/ci/instruction_budgets.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Ratchet documents
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        # Nobody may relax the ratchet data: the recorded measured values
        # and their floors may only rise. The guard used to run on pull
        # requests only, and a direct push to main could ship a lowered
        # document that keeps the 1.5 calibration gap — self-consistent,
        # so thresholds --check alone accepted it (issue #53). The guard
        # now runs on push too. The automated raise is unaffected: a raise
        # only lifts values, so its own push run is clean, and this step
        # runs BEFORE "Ratchet the thresholds", so a lowered document
        # fails the job before any raise could paper over it.
        #
        # On a pull request the merge ref merges the head into the base,
        # so HEAD^1 is the base tip and HEAD^2 the head, and the check
        # compares the document at their merge base with the head's copy
        # — never the working tree. On a push, BEFORE is the previous tip
        # of main and HEAD the new one. The history is still shallow by
        # the time this runs, and a shallow history can make git
        # merge-base return a wrong base without erroring, so the step
        # completes the history of both sides first. A branch-creation
        # push carries the all-zero BEFORE — nothing to compare against.
        #
        # Both branches pass --allow-declared-raises (issues #120 and
        # #133): a deliberate budget raise lands as its own commit whose
        # message carries one "Budget-Raise: <document> <key> <from> ->
        # <to>" line per raised leaf, naming the exact values the diff
        # carries, and the lines count only on commits touching nothing
        # outside the two budget documents — a raise cannot ride feature
        # work onto main, on a push or on a pull request. The routes
        # differ in the window's guarantee: the push branch requires base
        # to be an ancestor of head (a fast-forward of main), while the
        # PR branch's HEAD^1..HEAD^2 is the pull request's own commits by
        # construction — --route pr tells the guard which shape it is in.
        # Merge shape matters: a rebase merge keeps the raise commit's
        # lines; a squash merge may replace them with the PR title
        # (GitHub's squash message can also prefill the commit's own
        # message), and a squash that drops them makes the raise refuse
        # on main's push. A rebase merge is the deterministic route.
        #
        # The pull-request branch fetches the event's merge commit, never
        # refs/pull/<number>/head: the PR-number refspec was the untrusted
        # source of code-scanning alert #27
        # (actions/untrusted-checkout/medium) and fed alert #26 — the
        # analyser reads a git fetch whose command or env names the PR
        # number as pulling the untrusted head — and fetching the merge
        # commit completes both sides at once. github.sha is trusted event
        # provenance, and a mutable PR-head refspec is not what the guard
        # compares: HEAD^1 and HEAD^2 are its only inputs.
        env:
          CI_SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --unshallow origin "${CI_SHA}"
            python3 scripts/ci/check_ratchets.py --allow-declared-raises \
              --route pr HEAD^1 HEAD^2
          else
            if [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
              echo "branch creation: no previous main tip to compare against"
              exit 0
            fi
            git fetch --unshallow origin main "${BEFORE}"
            python3 scripts/ci/check_ratchets.py --allow-declared-raises "${BEFORE}" HEAD
          fi

      - name: Ratchet the thresholds
        # Only measurements from a main push may move the recorded
        # calibration — a pull request runs untrusted code and must not be
        # able to write it. The ratchet raises either coverage floor when
        # this run justifies it; a lower measurement, or one within the
        # hysteresis, leaves the document untouched. The raise never leaves
        # this job as a push: it is staged with the measured base commit as
        # an artifact for the top-level ratchet-push workflow (issues #134
        # and #133 part 2b) — this job holds no write token, and the push
        # authenticates with the deploy key in that workflow's own job.
        id: ratchet
        if: ${{ !cancelled() && steps.pytest.outcome == 'success'
                && steps.jscov.outcome == 'success'
                && github.event_name == 'push'
                && github.ref == 'refs/heads/main' }}
        env:
          JS_COVERAGE_OUT: ${{ runner.temp }}/js-coverage.json
        run: |
          measured="$(python3 -m coverage report --format=total --precision=1)"
          js_measured="$(python3 scripts/ci/js_coverage.py \
            "$JS_COVERAGE_OUT" --format=total)"
          python3 scripts/ci/ratchet.py --measured "${measured}"
          python3 scripts/ci/ratchet.py --language javascript \
            --measured "${js_measured}"
          python3 scripts/ci/thresholds.py --check
          if [ -n "$(git status --porcelain .github/ci-thresholds.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo '### Recorded by this run'
              echo
              echo '```diff'
              git diff -- .github/ci-thresholds.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Python coverage ${measured}% and JavaScript coverage" \
              "${js_measured}% justify no raise." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stage the raise for the push job
        # Runs only when the step above computed a raise. The staged pair
        # is everything the push job needs: the validated thresholds
        # document and the commit it was measured against, which is how
        # the race handling moves with the data — the push job drops the
        # raise when main no longer stands at the staged base.
        if: ${{ !cancelled() && steps.ratchet.outputs.changed == 'true' }}
        env:
          BASE: ${{ github.sha }}
        run: |
          mkdir -p "${RUNNER_TEMP}/ratchet-stage"
          cp .github/ci-thresholds.json "${RUNNER_TEMP}/ratchet-stage/"
          printf '%s\n' "${BASE}" > "${RUNNER_TEMP}/ratchet-stage/base.txt"

      - name: Upload the ratchet artifact
        if: ${{ !cancelled() && steps.ratchet.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ratchet-data
          path: ${{ runner.temp }}/ratchet-stage
          if-no-files-found: error

  # --- The patch-coverage report ------------------------------------------
  # INFORMATIONAL, never a gate — which is why no gate reads its result. A
  # comment that failed to post must not be able to block a merge, and the
  # number it reports is one a reviewer judges: a refactor that only moves
  # code, and a fix whose test lives behind an optional dependency, both read
  # low for reasons a threshold cannot tell apart. The ratchet in `coverage`
  # is the gate.
  #
  # Pull requests only, and only when coverage produced the artifact this job
  # consumes. A skipped ancestor must not hide that successful result. The
  # rendered report travels to the pull request as an artifact, and the
  # trusted `coverage comment` workflow posts it — see its header for why
  # the poster must be a workflow_run and not this job.
  diff-coverage:
    if: ${{ !cancelled() && needs.coverage.result == 'success'
            && github.event_name == 'pull_request' }}
    needs: coverage
    runs-on: ubuntu-latest

    # Per-job ceiling, like every other job's: a hung check fails in 10
    # minutes instead of holding GitHub's 6-hour default.
    timeout-minutes: 10

    permissions:
      # This job reads the proposed tree, so it must not carry a token that
      # can write conversation. The trusted workflow_run commenter owns that
      # token.
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit the event named, and the exact SHA `coverage`
          # measured. Resolving `refs/pull/N/merge` here instead would let
          # GitHub hand this job a different tree than the one the coverage
          # report describes.
          ref: ${{ github.sha }}
          # Both parents of that merge commit, which the diff below needs.
          fetch-depth: 0
          persist-credentials: false

      # actions/download-artifact v8.0.1
      - uses: >-
          actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: coverage-xml

      - name: Install the pinned statement analyzer
        # diff_coverage.py borrows coverage.py's statement analyzer — the
        # same pinned copy requirements-test.txt gave the measuring run, so
        # the two can never disagree about which lines are executable.
        run: python3 -m pip install --requirement requirements-test.txt

      - name: Measure the coverage of this change
        # HEAD is the merge tree checked out above and HEAD^1 is, by
        # construction, the base tip that was merged into it. The event
        # payload's `base.sha` is NOT that: the base branch can advance
        # between the event and the checkout, and every base commit merged in
        # since would then be reported as a line this pull request added.
        #
        # --text is load-bearing, not decoration: the pull request controls
        # .gitattributes on its own tree, so an attribute could render a
        # changed source file binary and cost the whole report. --text and
        # --no-ext-diff --no-textconv force the bytes through.
        run: |
          git diff --text --no-ext-diff --no-textconv --unified=0 \
            HEAD^1 HEAD > patch.diff
          python3 scripts/ci/diff_coverage.py \
            --coverage coverage.xml \
            --diff patch.diff > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package the comment for the trusted commenter
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf '%s\n' "$PR_NUMBER" > pr-number.txt

      - name: Upload the comment for the trusted commenter
        # actions/upload-artifact v7.0.1
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diff-coverage-comment
          path: |
            body.md
            pr-number.txt
          if-no-files-found: error

  # --- The committed-page check -------------------------------------------
  # Issue #105: out/frontier-models.html gets its "Source commit <code>…
  # </code>" stamp only when AA_SOURCE_COMMIT is set at build time, and only
  # refresh.yml sets it — so a page a pull request builds and commits by
  # hand goes out stamp-less, and the #94 hourly heal run republishes HEAD's
  # committed page byte for byte, stamp-less. This job refuses a committed
  # page that (i) lacks exactly one well-shaped source-commit stamp or
  # (ii) differs from a stamp-less rebuild of the same tree once build
  # provenance is masked. The check imports its masking from capture_gate,
  # so the two gates cannot disagree on what provenance is.
  page:
    runs-on: ubuntu-latest

    # Per-job ceiling, like every other job's: a hung check fails in 20
    # minutes instead of holding GitHub's 6-hour default.
    timeout-minutes: 20

    permissions:
      # The check only reads the tree and rebuilds into a temp dir under it.
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency pulls
          # in — reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          # No pip cache: the check is pure stdlib — nothing to install, so
          # nothing to key a cache off.
      - name: Check the committed page
        run: python3 scripts/ci/check_committed_page.py
