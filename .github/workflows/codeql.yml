name: codeql

# Static security analysis (advanced setup, not the repo-settings "default
# setup": the config lives here, reviewable in a diff like every other gate).
# Findings land in the Security tab rather than turning the build red, so a
# new query shipping upstream cannot block an unrelated push.
#
# THE JOB IS GATED ON VISIBILITY. Code scanning is free on public repositories
# and needs GitHub Code Security on private ones: without it the upload fails
# with "Code scanning is not enabled for this repository". A gate red on every
# push for a reason no commit can fix is one people learn to ignore, so the
# job skips itself instead: a private fork gets a skip rather than a red X,
# and enabling Code Security there turns it back on.
#
# The weekly cron is not redundant with push: CodeQL's query packs update
# continuously, and a new query only ever runs against code changed since it
# shipped, so without the cron a rule published today never reaches a file
# last touched a year ago.

on:
  workflow_call:
  schedule:
    # Wednesday 03:47 UTC. Off the hour and off Monday deliberately: the top
    # of the hour is when every cron on GitHub fires at once and jobs queue.
    - cron: '47 3 * * 3'
  workflow_dispatch:
    # Standalone dispatch runs (no ci-gate classification) run every job
    # unconditionally.

# This file is a ci-gate.yml callee: it keeps `workflow_call`, the weekly
# cron and `workflow_dispatch`, while ci-gate owns `push` and `pull_request`,
# unfiltered, since a trigger filter starts no run and the required check
# goes missing; its classification narrows the legs instead.
#
# PR heads still run untrusted code under the caller's pull_request run
# (the callee executes the caller's merge ref), so this job's only write is
# the `security-events: write` upload of its OWN analysis results, and the
# scheduled publish path (refresh.yml) stays off PR events entirely.

# Deny by default: a workflow with no permissions block hands every job the
# repository's default token scopes, so this empty block denies them and each
# job declares the grant it uses.
permissions: {}

concurrency:
  # The caller's convention, not a standalone `codeql-<ref>` group: one group
  # per pull request or per pushed SHA, so a later push's legs never cancel
  # an earlier push's.
  group: codeql-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # See the header: private repositories cannot upload the results.
    if: ${{ github.repository_visibility == 'public' }}
    # A hung analysis fails in 15 minutes instead of holding GitHub's 6-hour
    # default.
    timeout-minutes: 15

    permissions:
      # Writing the analysis results is the whole point; everything else stays
      # read-only.
      security-events: write
      actions: read
      contents: read

    strategy:
      # One entry per language CodeQL analyses here: `python` for the
      # pipeline, `actions` for the workflow files themselves.
      # The workflows are among the most privileged code in the repository —
      # refresh.yml pushes to `main` and publishes to docs-hub with a secret
      # — and actionlint + zizmor already read them only for known-bad
      # shapes; CodeQL asks a dataflow question of them instead, and the two
      # find different things. (This repo has no JS of its own: build.py
      # EMITS JavaScript into the page as string literals, which CodeQL
      # cannot see and which no gate in this repo checks; the browser tests
      # are what exercise it.) matrix.language feeds the job name, the init
      # step's `languages:` and the analyze step's `category:`, so each
      # entry lands as its own check.
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No `ref:` here: CodeQL must analyse exactly the commit it will
          # file alerts against, which is the event's own SHA. On a
          # pull_request event that SHA is the refs/pull/N/merge merge commit —
          # exactly what a checkout without `ref:` checks out.
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # `security-extended` over the default `security` pack: fetch_aa.py
          # pulls an untrusted payload off the network and parses it, which is
          # what the extra precision-medium queries are good at.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
