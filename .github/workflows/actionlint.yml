name: actionlint

# The gate on the gates. Everything else in .github/workflows is unreviewed
# code that runs with a repository token, and a mistake in it fails in ways
# the other gates structurally cannot catch: a workflow with a typo in an
# `if:` expression does not go red, it silently stops running.
#
# Two tools, because they answer different questions:
#
#   actionlint — is this workflow WELL-FORMED? Schema, expression syntax,
#   context availability, `runs-on` labels, and shellcheck over every `run:`
#   block, which is where most real bugs live.
#
#   zizmor — is this workflow SAFE? Script injection through `${{ }}` in a
#   `run:` block, over-broad `permissions:`, credential persistence after
#   checkout, unpinned action references.
#
# Both tools are pinned. actionlint is verified by checksum rather than
# trusted from the release page, because a linter that runs before every other
# gate is a supply-chain position worth defending. zizmor is hash-pinned in
# requirements-zizmor.txt and installed with --require-hashes (issue #127):
# the tool that judges every workflow's supply chain is itself installed
# byte-for-byte as reviewed.
#
# Suppressions belong at the offending line as a `# zizmor: ignore[rule]`
# comment WITH a justification, never as a raised --min-severity here: a
# threshold silences the next finding too, and the next one is the one nobody
# has thought about yet.

on:
  workflow_call:
  workflow_dispatch:
    # Standalone dispatch runs (no ci-gate classification) run every job
    # unconditionally.

# Trigger ownership moved to ci-gate.yml (issue #133): the push and
# pull_request triggers live there now. This leg is DELIBERATELY
# UNCONDITIONAL in ci-gate — no narrowing output may skip it — which
# preserves exactly the guarantee the old unfiltered triggers carried: a
# conflict marker committed into a Markdown file is still read (the
# merge-marker step below), the freshness and scope gates still read
# every head, not only code heads, and the two gate scripts stay watched
# on the hourly refresh bot's push, where both are trivially green (main
# carries itself).

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    # A hung job fails in 15 minutes instead of holding GitHub's 6-hour
    # default.
    timeout-minutes: 15

    env:
      # THE MANUAL UPDATE PATH (issue #50). actionlint ships as a
      # GitHub-release binary, which Dependabot cannot see — its pip
      # ecosystem reads requirements files and its github-actions ecosystem
      # reads `uses:` pins, and a curl-downloaded release tarball is neither
      # — so unlike every other tool pin in the repo, nothing bumps this one
      # automatically. Updating the tool is a deliberate act: take the
      # linux_amd64 checksum from the new release's own checksums file
      # (actionlint_<version>_checksums.txt) and land VERSION and SHA256
      # together, in one commit, so the pin never names a version its
      # checksum does not match.
      #
      # The fork, not rhysd's own release: stock 1.7.12 does not know the
      # `queue:` key in a concurrency group and rejects claim.yml's
      # reference block with `unexpected key "queue"` (issue #123).
      # v1.7.12-queue.1 carries upstream rhysd/actionlint#654; the same pin
      # runs in the claim, pr-gate and daedalus repositories. Return to
      # rhysd's own release once it ships the key.
      ACTIONLINT_VERSION: 1.7.12-queue.1
      ACTIONLINT_REPO: Nitjsefnie-OSC/actionlint
      # sha256 of actionlint_1.7.12-queue.1_linux_amd64.tar.gz, from the
      # release's own checksums file. Bump all three together.
      ACTIONLINT_SHA256: dcc2c42a7caaa197dfe63584a3851f62ef260f80b2cf221baaf05479661e1521

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check no tracked file carries a merge-conflict marker
        # a3363ac landed on upstream main with `<<<<<<< HEAD` and the
        # `>>>>>>> 0d9bffc` line still in README.md, and three review rounds
        # and every gate in that repository read straight past them: a
        # conflict marker is text that looks like prose in a Markdown file,
        # so only a mechanical check can see it. git grep reads the tracked
        # files out of the working tree, which on a clean checkout is the
        # repository as shipped, and -I keeps a binary from being reported as
        # a match. The three markers are matched in the shapes git writes
        # them: `<<<<<<< ` and `>>>>>>> ` carry the label after seven
        # characters, and the separator is exactly seven `=`; diff3's extra
        # `||||||| base` line changes nothing, because the other three are
        # still written. This job rather than the lint or suites ones because
        # both ignore `**/*.md` on their triggers, so the documentation-only
        # commit that carries the marker would never be read there — this
        # workflow's triggers are deliberately unfiltered (see above).
        run: |
          # git grep exits 1 for "no match" and above 1 for an error it could
          # not run, and a guard that reads its own error as a clean tree is
          # the false green this step exists to prevent.
          found=0
          git grep -nI -E '^(<{7}( |$)|>{7}( |$)|={7}$)' -- . || found=$?
          if [ "$found" -gt 1 ]; then
            echo "git grep exited $found, so no marker was looked for."
            exit "$found"
          fi
          if [ "$found" -eq 0 ]; then
            echo "A merge-conflict marker is committed. Resolve the conflict, rebase onto the target branch and push again."
            exit 1
          fi

      - name: Require this head to carry main's gate-defining commits
        # This repository carries no merge ruleset, so a green head vouches
        # only for the tree this run checked out — and main moves hourly (the
        # refresh workflow's capture commits), so a commit that lands on main
        # touching a file a merge-gate job reads is never applied to a pull
        # request before it merges, and the merge then publishes a tree no
        # green run ever saw. This is the only check that compares the two.
        #
        # In this job rather than a new one: this workflow is the gate on the
        # gates, its triggers are unfiltered so every head is judged, and a
        # `paths:` filter on a workflow hosting a merge-gate step would stop
        # the step reporting at all on the heads that need it (the trap the
        # old actionlint.yml trigger filter carried — removed in this change).
        #
        # Before setup-python and every install: work done against a base
        # main has already moved on from is work whose verdict does not
        # carry, and a head that fails here never pays for what follows.
        run: python3 scripts/ci/gate_base_freshness.py

      - name: Refuse a commit whose scope names a workflow outside the ci type
        # CONTRIBUTING's scope rule allows a workflow's `name:` as a scope
        # only with the `ci` type, and prose no gate reads is a convention —
        # a rule that exists only in prose is one nobody has to obey. In this
        # job rather than a new one, for the reason the freshness step names.
        # After the freshness step: both compare the head against freshly
        # fetched main, and both must read the rebased head.
        run: python3 scripts/ci/commit_scopes.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install actionlint
        # Downloaded and checksum-verified rather than piped from the install
        # script: `curl | bash` would make this job trust whatever that URL
        # serves at run time. Explicit timeouts so a hung connection fails the
        # step in two minutes instead of holding a runner for six hours.
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 -o "$tarball" \
            "https://github.com/${ACTIONLINT_REPO}/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint --version

      - name: Install zizmor
        id: install_zizmor
        # From requirements-zizmor.txt rather than an inline pin: Dependabot's
        # pip ecosystem reads manifest files, never a `run:` block, so the
        # inline pin was a version nothing ever bumped (issue #50).
        # --require-hashes installs the manifest byte-for-byte as reviewed
        # (issue #127). There is deliberately no `pip install --upgrade pip`
        # here: the unreviewed pip upgrade is an unaudited component — the
        # very thing the audit gate judges — and the runner's stock pip
        # installs the pinned manifest.
        run: python3 -m pip install --require-hashes -r requirements-zizmor.txt

      - name: actionlint
        id: actionlint
        run: ./actionlint -color .github/workflows/*.yml

      - name: zizmor
        # Runs even when actionlint is red, so one push reports both gates.
        # Not when the install itself failed, which would report a tool bug as
        # a clean audit.
        if: ${{ !cancelled() && steps.install_zizmor.outcome == 'success' }}
        env:
          # Enables the online audits (resolving action refs, checking for
          # known-vulnerable action versions). Read-only, and this workflow
          # declares contents: read.
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github/workflows/
