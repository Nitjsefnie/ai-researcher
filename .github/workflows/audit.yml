name: audit

# Dependency vulnerability gate: pip-audit resolves each requirements file to
# its full transitive tree and checks every resolved version against the PyPI
# advisory database and OSV.
#
# There is no requirements.txt here: the runtime is pure stdlib, with zero
# third-party imports. So this gate covers the toolchain — the lint, type,
# coverage and playwright pins, plus the two gate tools themselves (zizmor
# and pip-audit, requirements-zizmor.txt / requirements-pip-audit.txt) —
# which is a smaller surface than the sibling repos have but not an empty
# one: those tools run in CI with the repository token, and a compromised one
# is a supply-chain problem even though it never ships. Resolution is still
# the point rather than reading the pinned lines: a linter drags in a
# dependency tree of its own, and that is where an advisory lands.
#
# NOT HERMETIC, ON PURPOSE. The requirements files pin the direct tools only
# — no lockfile — so every install resolves its transitive tree fresh at run
# time. The one exception is requirements-zizmor.txt, whose single package
# carries --hash lines for actionlint.yml's --require-hashes install
# (issue #127); zizmor declares no dependencies, so nothing else was frozen
# to get there. That is what gives this gate its subject: the
# transitives are exactly where an advisory lands, and a frozen tree would go
# stale exactly when an advisory did. The recorded cost (issue #50): with
# zero repository change, a transitive release can turn CI red — here, or in
# any gate that installs from these files — or alter the coverage numbers
# that feed the ratchet in tests.yml.
#
# WHY THE CRON IS THE IMPORTANT TRIGGER. Every other gate here answers "did
# this commit break something", so push is the natural trigger. This one
# answers "is a version we froze months ago still safe", and that answer
# changes when a stranger publishes an advisory, with no commit here to hang
# it on. This repo goes weeks between pushes — a push-only audit would report
# clean the whole time.
#
# This gate FAILS the build rather than filing an advisory, the same stance as
# lint and types: a red gate a human must look at beats a notification that
# accumulates unread. When a fix genuinely is not available yet, add the
# advisory to --ignore-vuln WITH a comment saying why and what would clear it
# — never silence the whole gate.

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
    # Paired with pull_request, push must name branches: an in-repo PR head
    # would otherwise run twice per commit under two refs the github.ref
    # concurrency group cannot collapse.
    branches: [main]
  pull_request:
    # Same paths-ignore as push. No branches filter: PRs target main only
    # here.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  schedule:
    - cron: '12 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    # A hung job fails in 15 minutes instead of holding GitHub's 6-hour
    # default.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install pip-audit
        # From requirements-pip-audit.txt rather than an inline pin:
        # Dependabot's pip ecosystem reads manifest files, never a `run:`
        # block, so the inline pin was a version nothing ever bumped
        # (issue #50). The manifest itself stays unhashed (issue #127): this
        # workflow audits it per-manifest below, so a tampered pip-audit
        # artifact is exactly what the audit step would surface.
        #
        # There is deliberately no `pip install --upgrade pip` here: the
        # unreviewed pip upgrade is an unaudited component — the very thing
        # this gate judges — and the runner's stock pip installs the pinned
        # manifest.
        run: python3 -m pip install -r requirements-pip-audit.txt

      - name: Audit dependencies
        # Each requirements file gets its OWN pip-audit invocation, so every
        # manifest is audited the way its own install consumes it. The
        # former single invocation over all four is unshippable since
        # requirements-zizmor.txt grew --hash lines for actionlint.yml's
        # --require-hashes install (issue #127): pip-audit resolves ALL
        # --requirement files in one internal pip dry-run, and a hash-pinned
        # manifest beside un-hashed ones flips that resolution into
        # --require-hashes mode, which fails on the hashes the other
        # manifests do not carry (observed on pr-gate's first run of this
        # step). A manifest added at the repository root joins this audit
        # without editing this workflow.
        #
        # No --ignore-vuln entries at present.
        #
        # THE RETRY IS NARROW ON PURPOSE. pip-audit resolves against PyPI and
        # the advisory database over the network, and a reset connection
        # produces the same exit status as a real finding. A blanket retry
        # would re-run a genuine vulnerability three times before reporting
        # it, and a gate that goes red for reasons unrelated to its subject is
        # one people learn to ignore. So this retries ONLY transport/service
        # failures — connection errors, could-not-connect, SSLError, HTTP 5xx,
        # rate-limited 429 (the sole retried 4xx, so a 403/404 exits
        # immediately), and a ServiceError exception (issue #128). Findings
        # and every other failure are reported verbatim.
        run: |
          shopt -s nullglob
          manifests=(requirements*.txt)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "no requirements*.txt manifest at the repository root; nothing to audit" >&2
            exit 1
          fi

          for manifest in "${manifests[@]}"; do
            echo "auditing $manifest"
            resolved=0
            for attempt in 1 2 3; do
              if pip-audit \
                   --progress-spinner off \
                   --requirement "$manifest" \
                   > audit.out 2>&1; then
                cat audit.out
                resolved=1
                break
              fi

              if grep -qiE '4[0-9][0-9] Client Error' audit.out \
                  && ! grep -qiE '429 (Client Error|Too Many Requests)' audit.out; then
                echo "pip-audit failed with a non-retryable 4xx client error:" >&2
                cat audit.out >&2
                exit 1
              fi

              if grep -qiE 'connection (aborted|reset|error)|read timed out|temporary failure in name resolution' audit.out \
                  || grep -qiE 'Could not connect to (PyPI|OSV).*vulnerability feed' audit.out \
                  || grep -qiE '(^|[[:space:]])[[:alnum:]_.]*SSLError:' audit.out \
                  || grep -qiE '5[0-9][0-9] Server Error|502 Bad Gateway|503 Service Unavailable|504 Gateway Timeout|429 (Client Error|Too Many Requests)' audit.out \
                  || grep -qiE '(^|[[:space:]])(pip_audit\._service\.interface\.)?ServiceError:' audit.out; then
                echo "attempt $attempt: transport/service failure talking to PyPI, retrying"
                tail -n 5 audit.out
                sleep $(( attempt * 15 ))
                continue
              fi

              echo "pip-audit reported findings:" >&2
              cat audit.out >&2
              exit 1
            done

            if [ "$resolved" -eq 0 ]; then
              echo "pip-audit could not reach PyPI after 3 attempts on $manifest:" >&2
              cat audit.out >&2
              exit 1
            fi
          done
