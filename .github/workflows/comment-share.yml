name: comment share
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: comment-share-${{ github.ref }}
  cancel-in-progress: true
jobs:
  comment-share:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: Nitjsefnie-Actions/comment-ratchet@721426819be9e05deb76d56364f671b87fa05fbf # v1.0.0
        with:
          target: '15'
          records: '.github/comment-share.json'
          mode: 'auto'
          base-ref: ${{ github.event.pull_request.base.sha }}
      # Tightening stays keyless here; ratchet push validates and lands
      # these bytes through the main-push deploy key (issue #281).
      - name: Stage tightened records
        id: stage
        if: github.event_name == 'push'
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          original="${RUNNER_TEMP}/comment-share-original.json"
          git show "${HEAD_SHA}:.github/comment-share.json" > "$original"
          if cmp -s "$original" .github/comment-share.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          data="${RUNNER_TEMP}/comment-share-data"
          mkdir -p "$data"
          cp .github/comment-share.json "$data/comment-share.json"
          printf '%s\n' "$HEAD_SHA" > "$data/base.txt"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Upload tightened records
        if: github.event_name == 'push' && steps.stage.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comment-share-data
          path: ${{ runner.temp }}/comment-share-data
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 1
