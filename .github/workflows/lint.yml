name: lint

# Lint gate: pylint + pycodestyle. Style is deliberately NOT enforced
# (line-too-long off, max-line-length 10000) — this gate exists for real
# defects, not formatting opinions. import-error and no-name-in-module stay
# disabled in pylint on purpose: pyright (the `types` workflow) is the one
# tool that owns unresolved-import reporting. Separate workflow from tests so
# a lint failure is distinguishable from a test failure at a glance.

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install linters
        id: install
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt

      - name: pylint
        run: git ls-files '*.py' | xargs python3 -m pylint

      - name: pycodestyle
        # Runs even when pylint is red, so one push reports both gates — but
        # not when the install itself failed.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: git ls-files '*.py' | xargs python3 -m pycodestyle
