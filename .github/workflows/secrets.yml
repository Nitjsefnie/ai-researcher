name: secrets

# Gitleaks sweeps the full tree and the full git history on every run,
# catching the credentials GitHub's push protection does not: push
# protection covers provider-recognised patterns only, so an ad-hoc
# token, a session cookie, or a private URL with embedded credentials
# reaches main unremarked.
#
# THE PULL REQUEST RUN IS A REQUIRED MERGE CHECK. The pull_request
# trigger below is load-bearing: the `main requires green checks`
# ruleset requires this job's `gitleaks` context on main,
# so a pull request that introduces a secret this scan detects cannot
# merge. Renaming the job or dropping the pull_request trigger makes
# every future merge strand loudly on a missing required check — by
# design; restore the job, do not edit the ruleset around it.
#
# THE CRON IS STILL THE GATE FOR COMMITS NO WORKFLOW SAW. A push carrying
# [skip ci], or a commit that landed before this workflow existed, never
# started a run; the daily schedule re-answers for the whole history, so
# such a commit is scanned the next morning rather than never.
#
# THE BINARY IS FROZEN BY HAND. v8.30.1 is pinned and digest-verified, so
# no run scans with a silently changed scanner. Every bump rescans the
# whole history under the new rules, which is the price of the bump.

on:
  push:
    # main only. A branch pushed while its pull request is open would run
    # this a second time against the same SHA.
    branches: [main]
  pull_request:
  schedule:
    # Off the hour, and clear of this repository's other scheduled slots:
    # refresh hourly :11, audit daily 04:12, scorecard Sat 02:23 and codeql Wed 03:47.
    - cron: '26 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scan reads `git log -p`, so a shallow clone
          # would scan a suffix of history and call the rest clean.
          fetch-depth: 0
          # Nothing here pushes; the job token must not survive the checkout.
          persist-credentials: false

      - name: Download gitleaks and verify its digest
        run: |
          curl --connect-timeout 5 --max-time 120 -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the tree and the history
        # Bare on purpose: this step's exit status IS the gate, so no
        # condition, fallback or error-swallowing suffix belongs here.
        # The log is public: --verbose names findings, --redact masks them.
        run: ./gitleaks detect --verbose --redact --config .gitleaks.toml

      - name: Positive control - prove the scanner detects
        # A green scan with zero findings proves nothing about the scanner:
        # a broken config, a wrong binary or a rules regression all render a
        # clean scan meaningless. Plant a canary the default rules must flag
        # and assert the scan FAILS on it. A PASS here means the gate is
        # blind. The canary is a fabricated Slack-format token that the
        # default slack-bot-token rule must flag; the AWS documentation's
        # example key is deliberately NOT used, because gitleaks's default
        # allowlist does not flag it (verified 2026-10-03, gitleaks 8.30.1).
        run: |
          mkdir -p /tmp/gitleaks-canary
          # The token is split across two literals on purpose: a contiguous
          # Slack-format token in this file would be rejected by GitHub's
          # push protection on push and flagged by this workflow's own scan
          # of the tree. Only the generated decoy.env is contiguous, and it
          # is the file the scanner must flag.
          printf 'slack_bot_token = "xoxb-%s"\n' '248965712390-163184295512-SxqzwmAbCdEfGhIjKlMnOpQr' > /tmp/gitleaks-canary/decoy.env
          # The exit code alone cannot separate a finding from a fatal
          # gitleaks error, which also exits nonzero - a control that read
          # only the code would print "passed" while the gate is blind.
          # --verbose puts a RuleID: line on every finding, so the control
          # passes only when the scan reports an actual detection.
          set +e
          out=$(./gitleaks detect --no-git --verbose --source /tmp/gitleaks-canary --config .gitleaks.toml 2>&1)
          rc=$?
          set -e
          if [ "$rc" -ne 1 ] || ! printf '%s\n' "$out" | grep -q '^RuleID:'; then
            echo '::error::positive control failed: expected exit 1 with a RuleID finding, got rc='"$rc"
            printf '%s\n' "$out"
            exit 1
          fi
          echo 'positive control passed: gitleaks flagged the canary'
