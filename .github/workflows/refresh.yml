name: refresh

# The automated capture: fetch AA's leaderboard every hour, and when the
# numbers actually moved, commit the new capture and publish the rebuilt page
# to docs-hub.
#
# WHAT COUNTS AS "MOVED" IS THE TWO CAPTURE FILES, NOT data/. The stamp file
# beside them records today's date on every fetch, so gating on the directory
# would commit and publish a date-only change every calendar day whether or not
# AA measured anything new. Gating on the captures themselves means the stamp
# moves when the data moves, and a quiet day is silent.
#
# There are two captures because the page draws two AA products: the model
# leaderboard and the Coding Agent Index. Either one moving is news, so the
# gate is an OR over both.
#
# THAT GATE ANSWERS "DID THE DATA MOVE", WHICH IS NOT THE SAME QUESTION AS
# "IS THE LIVE PAGE STALE". A change to build.py changes the page while the
# capture stays byte-identical, so every step here would skip and docs-hub
# would keep serving the old render until AA happened to move on its own --
# indefinitely, on a quiet weekend. The `force` dispatch input exists for
# exactly that case and is the ONLY way a build-only change reaches the hub.
#
# THE SUITE RUNS BEFORE THE COMMIT, NOT AFTER. A capture can break the page —
# a new field shape, a model with a null AA never emitted before — and the
# whole point of a scheduled publish is that nobody is watching it happen. A
# red build here leaves the last good capture committed and the last good page
# live, which is the correct failure.
#
# fetch_aa.py exits nonzero when the flight payload or the model schema changes
# shape, when AA bumps the Intelligence Index version build.py is written
# against, when the cost breakdown drops a slug build.py reads, or when the
# per-evaluation costs stop summing to the published total. Those are the
# designed signals to go re-read the leaderboard and the methodology page by
# hand; a red run here means read them, not retry.

on:
  schedule:
    # Hourly, off the hour: the top of the hour is when every cron on GitHub
    # fires at once and jobs queue.
    - cron: '11 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Rebuild and publish even when AA's capture is unchanged. For a change
          to the BUILD rather than the data: the page the code produces has
          moved, so the live artifact is stale until this is run.
        type: boolean
        default: false

permissions:
  # This job commits the capture it takes. Everything else stays read-only.
  contents: write

concurrency:
  # Never cancel in progress: a cancelled run can land between the commit and
  # the publish, leaving the repo and the hub disagreeing.
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push at the end uses an explicit remote URL instead, so the
          # token never sits in .git/config for later steps to reuse.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install the test toolchain
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-test.txt

      - name: Install Chromium for playwright
        run: python3 -m playwright install --with-deps chromium

      - name: Capture the leaderboard
        run: python3 scripts/fetch_aa.py

      - name: Did anything move?
        id: capture
        run: |
          if git diff --quiet -- data/aa-raw-models.json data/aa-raw-coding-agents.json; then
            changed=false
            # Drop the date-only stamp change so the tree is clean. The stamp
            # records when the DATA moved, so a quiet fetch must not bump it.
            git checkout -- data/captured-at.txt
            echo 'AA capture unchanged — nothing committed, nothing published.' \
              >> "$GITHUB_STEP_SUMMARY"
          else
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          # `changed` answers "did the data move", `proceed` answers "should we
          # rebuild and publish" — a forced run says yes to the second alone.
          # `inputs.force` is the empty string on a schedule run, so no second
          # condition is needed to keep the scheduled path unchanged.
          if [ "$changed" = true ] || [ "${{ inputs.force }}" = 'true' ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarise what changed
        # Runs on `proceed`, not `changed`: this is the ONLY step that executes
        # diff_aa.py, so gating it on the data moving meant a forced run could
        # go green while the differ was broken -- which is exactly how a
        # KeyError on a removed field reached main.
        if: steps.capture.outputs.proceed == 'true'
        # Both paths compare the committed capture against the one just
        # fetched. The paths are passed EXPLICITLY AND RELATIVELY: the defaults
        # are absolute, and an absolute runner path (/home/runner/work/...)
        # baked into a commit message is permanent noise.
        #
        # The run log gets the full report; the commit gets the same report
        # under a subject line naming what moved. The speed section is already
        # threshold-filtered and unchanged frontier sections are omitted at
        # the source, so the commit carries everything that is news.
        env:
          CHANGED: ${{ steps.capture.outputs.changed }}
        run: |
          python3 scripts/diff_aa.py git:HEAD data/aa-raw-models.json > diff.txt
          # Only a run whose DATA moved gets diff_aa's message; a forced
          # build-only run writes its own in the commit step.
          if [ "$CHANGED" = true ]; then
            python3 scripts/diff_aa.py git:HEAD data/aa-raw-models.json \
              --commit-msg > commit-msg.txt
          fi
          {
            echo '### What moved'
            echo
            echo '```'
            cat diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild the page
        if: steps.capture.outputs.proceed == 'true'
        run: python3 build.py

      - name: Run the suite against the new capture
        if: steps.capture.outputs.proceed == 'true'
        run: python3 -m pytest -q -ra

      - name: Commit the capture
        if: steps.capture.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/aa-raw-models.json data/aa-raw-coding-agents.json \
                  data/captured-at.txt out/frontier-models.html
          # The message is diff_aa.py's own rendering, subject line included —
          # not truncated here. A long one means a lot genuinely moved, and
          # that is the day you want the detail. A forced run with an unchanged
          # capture never ran the differ, so it writes its own subject.
          if [ -f commit-msg.txt ]; then
            printf '\n%s\n' 'Captured by .github/workflows/refresh.yml.' \
              >> commit-msg.txt
          else
            printf '%s\n\n%s\n' \
              'Rebuild the page: forced run, AA capture unchanged' \
              'The build moved, the data did not. Republished so the live page matches main.' \
              > commit-msg.txt
          fi
          # A forced run can produce a byte-identical page; committing nothing
          # is the correct outcome, and `git commit` would fail on it.
          if git diff --cached --quiet; then
            echo 'Rebuilt page is byte-identical — nothing committed.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -F commit-msg.txt
          # No co-author trailer: no model authored this commit. A refresh that
          # a person or an agent drives by hand still carries one.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}" HEAD:main

      - name: Publish to docs-hub
        if: steps.capture.outputs.proceed == 'true'
        env:
          DOCS_HUB_API_KEY: ${{ secrets.DOCS_HUB_API_KEY }}
        run: |
          python3 scripts/publish_docs.py out/frontier-models.html \
            --slug ai-researcher/frontier-models \
            --title "Frontier models — intelligence vs cost per task" \
            --from ai-researcher \
            --tags benchmarks,comparison,interactive,ai \
            --project ai-researcher
