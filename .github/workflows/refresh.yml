name: refresh

# The automated capture: fetch AA's leaderboard every hour, and when the page
# built from the new capture would differ from the one it replaces, commit the
# new capture and publish the rebuilt page to docs-hub.
#
# THE WRITE SIDE IS A SEPARATE JOB (issue #143). The `refresh` job captures,
# gates, rebuilds, installs third-party dependencies, downloads Chromium and
# runs the full suite -- so it holds NOTHING but a read-only token, and the
# hour's commit payload (the fresh captures, the built page, the window
# files, the differ's message) leaves it as an artifact of this same run.
# The `publish` job is the workflow's only contents:write holder and the
# credential's only reader: it downloads the artifact, replays the hour's
# commit (the window retirement first, then the data commit) against main in
# a scratch repo with git plumbing alone -- no checkout, no pip, no browser,
# no script from the tree -- pushes it with the documented race handling, and
# publishes to docs-hub. A red capture or a red suite fails the refresh job,
# and a failed need never starts the writer: NO commit and NO publish, and
# the hourly cadence stays green-behaved.
#
# WHAT COUNTS AS "MOVED" IS THE RENDERED PAGE, NOT THE RAW CAPTURE BYTES
# (issue #94). The gate (scripts/capture_gate.py) builds the page twice --
# once from HEAD's two captures, once from the fresh ones -- and compares the
# two files with build-machine provenance normalized out, because none of it
# is rendered data: the source-commit stamp (both gate builds run stamp-less),
# the capture date (both temp data dirs carry one synthetic captured-at.txt),
# and the raw-byte digest over the capture files (masked from both pages
# before comparing -- it moves with every sub-render byte AA wobbles).
# "Moved" means the masked pages differ. The old raw-byte comparison let AA's
# hourly sub-render churn commit and publish content the page never renders:
# 23 of the last 30 refresh commits carried "nothing the page renders".
#
# Rendered speed columns get one refinement, so the gate agrees with
# diff_aa.py's own definition of news for the two speed fields the differ
# thresholds (SPEED_SHOWN: medianOutputTokensPerSecond,
# intelligenceIndexTimePerTask): each fresh cell is tested directly against
# the last COMMITTED value at the differ's news threshold (SPEED_TOL,
# --speed-tol's default) -- within it, the cell is jitter and carries the
# committed value; past it (or missing on either side) it stands and
# commits. agentWallTimeSec (build.py:443-444) is reconciled under the same
# threshold even though the differ's report never carries it (its classifier
# files it as derived and drops it): the page renders it, so gate-side
# strictness covers it -- intentional, not tool agreement. The cost is
# stated in the gate: the page's speed columns can lag AA's live
# re-sampling by just under the threshold -- and no further, because each
# hour compares against the last committed value, so a sustained crawl
# crosses the threshold cumulatively and commits.
#
# There are two captures because the page draws two AA products: the model
# leaderboard and the Coding Agent Index. The OR survives inside the rendered
# gate -- it builds from both files, so either one moving is news.
#
# THE GATE ANSWERS "WOULD THE RENDERED PAGE MOVE", WHICH IS NOT THE SAME
# QUESTION AS "IS THE LIVE PAGE STALE". A change to build.py changes the page
# while the capture stays byte-identical -- and the gate builds BOTH sides
# with the new code, so it still reports no change -- and every step here
# would skip, leaving docs-hub serving the old render until AA happened to
# move on its own, indefinitely, on a quiet weekend. Two paths bring a
# build-only change to the hub: the `force` dispatch input, which rebuilds
# and publishes in one run, and the heal gate below, which republishes
# whenever the live page is behind main.
#
# THE `published` REF IS THE HEAL GATE'S MEMORY. The branch
# refs/heads/published on the remote points at the main commit whose
# out/frontier-models.html is live on the hub. It moves only in the write
# job's publish step, only after the upload succeeded, and only forward
# along main's history (fast-forward by construction). When a run's capture
# is unchanged, it fetches the ref and compares the page against HEAD: a
# missing ref (never published) or a differing page (a publish that failed
# or never ran) sets proceed, so the stale page is republished by the next
# run instead of being skipped forever. A green no-op now means "the live
# page is current", not merely "the data did not move".
#
# TWO OVERLAPPING RUNS CAN STILL INVERT THE UPLOAD ORDER (issue #74). The
# concurrency group serializes runs, but an OLDER run can still reach the
# publish step after a newer one and land its upload LAST, leaving the hub
# serving the older page under a ref that names the newer commit — an
# inversion neither the heal gate's ref comparison nor the commit step can
# see. Two guards close it: the publish step compares the freshly fetched
# `published` ref against this run's HEAD via the GitHub compare API and
# ABORTS green when the ref is ahead (a newer run already published; the
# newest run never aborts, so within any overlap the newest page always
# wins), and the heal gate also compares the hub's live page against HEAD
# byte-for-byte, so even the residual seconds-wide window heals on the next
# unchanged-capture run.
#
# THE SUITE RUNS BEFORE THE COMMIT JOB, NOT AFTER. A capture can break the
# page — a new field shape, a model with a null AA never emitted before —
# and the whole point of a scheduled publish is that nobody is watching it
# happen. A red build here fails the refresh job, and a failed need never
# starts the write job: the last good capture stays committed and the last
# good page live, which is the correct failure.
#
# THE PUSH TO MAIN CAN RACE. The concurrency group serializes runs, but two
# of them can still pass each other between their checks and their pushes
# (observed 2026-09-28: runs 287/288, seven seconds apart; the loser died on
# a non-fast-forward rejection). The write job's commit step treats a
# rejected push as a race, not a failure: fetch the moved main, rebase onto
# it, and push once more. A rebase conflict means the concurrent run pushed
# a different capture for the same hour, so the loser CONCEDES -- green,
# publish=false, nothing committed or published -- because the concurrent
# run's capture stands and publishing it is that run's job. The retry is the
# final attempt: a second rejection fails the run red rather than looping.
# The retirement push (below) keeps the same handling with a SILENT
# concession, as the capture step's old inline push_head did.
#
# fetch_aa.py exits nonzero when the flight payload or the model schema changes
# shape, when AA bumps the Intelligence Index version build.py is written
# against, when the cost breakdown drops a slug build.py reads, or when the
# per-evaluation costs stop summing to the published total. Those are the
# designed signals to go re-read the leaderboard and the methodology page by
# hand; a red run here means read them, not retry.
#
# EXIT 3 IS THE DISPUTED PUBLISH (issue #118, amending #100). AA's two routes
# are independently cached Vercel pages whose data lands at different times --
# measured windows from ~20 minutes to 3.5+ hours -- and re-reads never
# converge inside any retry bound, so a capture that straddles an update
# cannot be made consistent by retrying. Since #118 the refusal is buildable:
# fetch_aa.py exits 3 but writes data/aa-disagreement-snapshot.json (both
# routes' raw payloads plus the disagreement map), the Capture step writes
# the window stamp and FALLS THROUGH, and the rendered gate decides moved vs
# unchanged like any hour. The disputed page -- a disputed banner, both
# routes' values in disputed tooltips and table cells, disputed models
# sitting out the frontiers -- publishes the same hour and reverts
# automatically at convergence, when the next agreeing capture retires the
# stamp and the snapshot. There is NO time bound on this mode: the disputed
# banner is the visible alarm, so the 3 h red bound of #100 is retired for
# this exit code. The schema guards run on the disputed merge too, so exit 1
# (schema change, index bump, transport failure) still fails red immediately
# -- only the disagreement itself stopped being red. When a capture succeeds
# again, the hour marks the window RETIRING: the capture step removes the
# stamp AND the snapshot from its tree and stages their removal for the
# write job, which commits "Route agreement restored; resume captures
# (issue #100)" and pushes; a push lost to the race concedes green either
# way, and a lost stamp is self-healing on the next run.
#
# FORCE DURING A WINDOW NOW REBUILDS (issue #118, amending #103). A forced
# dispatch used to be terminal behind a refused capture because there was
# nothing to republish -- the last good page already stood while the hour
# green-skipped. Since #118 a disputed hour captures and builds like any
# other, so force during a window rebuilds and republishes the disputed
# page; the Capture step's `captured` verdict stays true on exit 3. (The
# verdict remains the force gate's input: were an exit ever classified as
# refused again, force would be vetoed exactly as #103 built it.)

on:
  schedule:
    # Hourly, off the hour: the top of the hour is when every cron on GitHub
    # fires at once and jobs queue.
    - cron: '11 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Rebuild and publish even when AA's capture is unchanged. For a change
          to the BUILD rather than the data: the page the code produces has
          moved, so the live artifact is stale until this is run.
        type: boolean
        default: false

concurrency:
  # Never cancel in progress: a cancelled run can land between the commit and
  # the publish, leaving the repo and the hub disagreeing.
  group: refresh
  cancel-in-progress: false

# Least-privilege floor (issue #52 review): every job here declares its own
# permissions block -- the refresh job read-only (it runs the capture, the
# installs and the suite), the publish job the sole write elevation, where
# the pushes and the credential are. The floor caps what the inheritance can
# leak: a job added later WITHOUT its own block inherits read, not the
# repository default.
permissions:
  contents: read

jobs:
  refresh:
    name: Capture, gate, rebuild, verify
    runs-on: ubuntu-latest

    # Job-level rather than workflow-level (issue #52), and READ-ONLY since
    # #143: this job runs the capture, third-party installs, a downloaded
    # browser and the suite, so nothing in it may ride a write token. The
    # hour's commit payload leaves as an artifact for the publish job, the
    # workflow's only writer.
    permissions:
      contents: read

    outputs:
      # The writer's gate: proceed is the rendered-gate + heal verdict the
      # publish job's `if` reads through needs.refresh.outputs.
      proceed: ${{ steps.capture.outputs.proceed }}

    # Sized for a FULL heal run — pip + Chromium installs, the full suite
    # with the browser — not the 13-second unchanged-capture
    # skip that most hours are. A hung run fails in 30 minutes instead of
    # holding GitHub's 6-hour default.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes (issue #143). Leaving the job token
          # in .git/config would let any later step -- or anything a
          # dependency pulls in -- reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt

      # fetch_aa.py is pure stdlib (build.py, whose pins it reads, is too),
      # so the capture runs before the toolchain exists: on the quiet
      # majority of runs the capture is unchanged and `proceed` is false,
      # and the two installs below are skipped entirely -- the gate decides
      # whether the toolchain is needed at all, instead of paying 40-50 s of
      # pip + Chromium on every no-op hour.
      #
      # The refusals are not all the same colour (issues #100, #118). Exit 1
      # is the designed red: schema change, index bump, fetch failure -- go
      # re-read AA by hand. Exit 3 is the route-disagreement refusal, and
      # since #118 it is buildable: fetch_aa.py writes the disagreement
      # snapshot, this step writes the window stamp, and the hour proceeds
      # to the rendered gate -- the disputed page publishes and carries the
      # banner until the routes agree. There is no time bound on a window.
      - name: Capture the leaderboard
        # The id is the force gate's handle: "Did anything move?" reads this
        # step's `captured` verdict through it (issue #103), and the staging
        # step reads `retire` the same way (#143).
        id: fetch
        run: |
          set +e
          python3 scripts/fetch_aa.py 2> /tmp/fetch-err.txt
          rc=$?
          set -e
          stamp=data/aa-route-disagreement.txt
          now=$(date -u +%s)

          if [ "$rc" -eq 0 ]; then
            # captured=true is this step's verdict for the force gate in
            # "Did anything move?" (issue #103): only a capture that ran
            # may honor a forced rebuild.
            echo "captured=true" >> "$GITHUB_OUTPUT"
            # Agreement restored after a skipped stretch: retire the stamp
            # so its age can never trip an alarm. The window files leave
            # this tree too -- so the rendered gate builds a clean page --
            # and the removal is staged for the write job, which commits it
            # against main. A push lost to the race concedes SILENTLY (see
            # the publish job): the next successful capture retires the
            # stamp again.
            if git ls-files --error-unmatch "$stamp" > /dev/null 2>&1 \
               || git ls-files --error-unmatch data/aa-disagreement-snapshot.json > /dev/null 2>&1; then
              # The window closes: the stamp AND the disputed snapshot leave
              # the tree together, so the next build renders normally.
              git rm -q --ignore-unmatch "$stamp" data/aa-disagreement-snapshot.json
              echo "retire=true" >> "$GITHUB_OUTPUT"
              echo "AA's routes agree again — disagreement stamp and snapshot staged for removal; captures resume (issue #118)." \
                >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          if [ "$rc" -eq 3 ]; then
            # Issue #118: the refusal now carries a buildable disputed
            # snapshot. The stamp records the window's start once (the
            # banner names one window across hours) and refreshes the
            # window's diagnostic after it; the snapshot is the hour's own
            # capture. Nothing is committed HERE -- the rendered gate
            # decides moved vs unchanged, and the write job commits only
            # what the suite passed. From here a disputed hour proceeds
            # exactly like a moved-capture hour.
            echo "captured=true" >> "$GITHUB_OUTPUT"
            if [ ! -f "$stamp" ]; then
              {
                echo "$now"
                cat /tmp/fetch-err.txt
              } > "$stamp"
            else
              start="$(head -n 1 "$stamp")"
              case "$start" in
                ''|*[!0-9]*)
                  echo "AA route-disagreement stamp is corrupt (first line: '$start') -- the disputed banner could not name the window; re-read AA by hand (issue #118)." >&2
                  cat /tmp/fetch-err.txt >&2
                  exit 1 ;;
              esac
              {
                head -n 1 "$stamp"
                cat /tmp/fetch-err.txt
              } > "$stamp.new" && mv "$stamp.new" "$stamp"
            fi
            if [ ! -f data/aa-disagreement-snapshot.json ]; then
              echo "fetch_aa exited 3 without writing the disagreement snapshot -- go re-read AA by hand (issue #118)." >&2
              cat /tmp/fetch-err.txt >&2
              exit 1
            fi
            echo "AA's routes disagree -- building and publishing the disputed capture (issue #118). The page carries the disputed banner until the routes agree." \
              >> "$GITHUB_STEP_SUMMARY"
            # The disputed hour is a GREEN hour: the rendered gate below
            # decides moved vs unchanged. Without this exit the branch would
            # fall through to the red handler and exit 3 -- the exact
            # hold-and-fail behavior this branch exists to replace.
            exit 0
          fi

          # Every other exit code is the designed red -- schema change,
          # index bump, fetch failure -- exactly as before issue #100.
          cat /tmp/fetch-err.txt >&2
          exit "$rc"

      - name: Did anything move?
        id: capture
        # The Capture step's verdict travels through env, not an inline
        # template: zizmor's template-injection audit fails any direct
        # `${{ }}` into `run:` text (issue #103's gate), and the env
        # mapping is its sanctioned route. The value is our own step
        # output, not attacker-controlled -- the env form is still the
        # convention.
        env:
          CAPTURED: ${{ steps.fetch.outputs.captured }}
        run: |
          # The rendered gate (see the header): build the page from HEAD's
          # captures and from the fresh ones, normalize the build-machine
          # provenance out of both, reconcile sub-threshold speed re-samples
          # against HEAD's committed values, and call it moved only when the
          # pages differ. A nonzero exit fails this step under bash -e -- a
          # capture the builder cannot parse turns the run red here, never
          # silently "changed" -- while no capture at HEAD (the first capture
          # ever) fails OPEN as changed, so the first run publishes.
          changed="$(python3 scripts/capture_gate.py)"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = false ]; then
            # The fresh captures render identically to HEAD's, so restore the
            # whole directory, not only the stamp: leaving either capture in
            # the tree would stage it in the staging step's payload for a
            # later commit. This also restores captured-at.txt -- the
            # stamp records when the DATA moved, so a quiet fetch must not
            # bump it.
            git checkout -- data/
          fi
          # The heal gate: a run whose publish failed or never ran left the
          # hub stale while every later capture stayed identical, and plain
          # "nothing moved" silence would never repair it. The `published`
          # branch records the last main commit whose page is live; a MISSING
          # ref means nothing was ever published, and a page under it that
          # differs from HEAD means the live render is behind main. Either
          # way this run republishes. ANY fetch failure is treated as stale:
          # republishing a page that was already current costs one hub
          # version, while a real outage still fails red at the write job's
          # publish step's ref update.
          live_stale=false
          hub_stale=false
          if [ "$changed" = false ] && [ "${{ inputs.force }}" != 'true' ]; then
            # Anonymous fetch: relies on the repo being public. If it ever
            # goes private, this gate degrades to an hourly republish --
            # self-consistent, since the ref update still authenticates
            # via GH_TOKEN in the write job's publish step.
            if git fetch --depth=1 origin \
                 refs/heads/published:refs/remotes/origin/published 2>/dev/null; then
              if ! git diff --quiet origin/published HEAD -- out/frontier-models.html; then
                live_stale=true
              fi
            else
              live_stale=true
            fi
            # The hub check (issue #74). The ref comparison above cannot see
            # one inversion: an upload that lands AFTER the published ref
            # moved (two overlapping runs, the older upload arriving last).
            # The ref then agrees with HEAD while the HUB serves the older
            # page, and nothing would ever republish. So the unchanged path
            # also fetches the hub's live page — the public /d/ route serves
            # the stored bytes verbatim, proven byte-identical to the
            # committed page (2026-09-29) — and compares it byte-for-byte
            # against HEAD's page. Divergence sets hub_stale, as does a
            # failed fetch: same stance as the ref fetch above, an extra
            # republish costs one hub version, and a real outage fails red
            # at the write job's publish step.
            hub_page="$(mktemp)"
            if curl -fsS --connect-timeout 10 --max-time 30 \
                 https://docs.nitjsefni.eu/d/ai-researcher/frontier-models \
                 -o "$hub_page"; then
              git show HEAD:out/frontier-models.html | cmp -s - "$hub_page" || hub_stale=true
            else
              hub_stale=true
            fi
            rm -f "$hub_page"
          fi
          # `changed` answers "did the data move", `proceed` answers "should
          # we rebuild and publish" — a forced run says yes to the second
          # alone, but ONLY when the capture actually ran (issue #103): a
          # refused capture is terminal against force, so a forced dispatch
          # during a live disagreement window has nothing to rebuild -- the
          # last published page already stands -- and the hour is not
          # mislabelled as an ordinary forced no-op. A run that only heals
          # the live page still proceeds, whether the `published` ref's page
          # or the hub's live page is what is behind. `inputs.force` is the
          # empty string on a schedule run, and `$CAPTURED` is empty only
          # for run shapes older than the output, so both defaults keep the
          # scheduled path unchanged. (The verdict reaches this shell as
          # the env var $CAPTURED, not an inline template expression --
          # zizmor's template-injection audit fails those in run text, and
          # the env mapping is its sanctioned route.)
          #
          # A forced dispatch during a disputed hour is honored since
          # #118: there is something to rebuild. The `CAPTURED != "false"`
          # veto (#103) stays for any future refused classification.
          if [ "$changed" = true ] \
             || { [ "$CAPTURED" != "false" ] && [ "${{ inputs.force }}" = 'true' ]; } \
             || [ "$live_stale" = true ] || [ "$hub_stale" = true ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi
          # Independent ifs, not an elif chain: live_stale and hub_stale can
          # both fire in one run, and the chain printed only the first line.
          # Each cause prints its own line, so every outcome is summarised.
          # (Either flag being true already implies changed=false: they are
          # only ever set under the unchanged path above.)
          # A run that proceeds on force alone must never print the quiet
          # line (#80), and a refused capture never earns it either (issue
          # #103): the Capture step's own skip line already explains the
          # hour, and "AA capture unchanged" would mislabel it.
          if [ "$changed" = false ] && [ "${{ inputs.force }}" != 'true' ] \
             && [ "$CAPTURED" != "false" ] && [ "$live_stale" = false ] && [ "$hub_stale" = false ]; then
            echo 'AA capture unchanged and the live page is current — nothing committed, nothing published.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$live_stale" = true ]; then
            echo 'AA capture unchanged, but the live page is stale — republishing it.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$hub_stale" = true ]; then
            echo 'AA capture unchanged, but the hub serves a page that differs from HEAD — republishing it.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # Both installs gate on `proceed`, not `changed`: a heal run has an
      # unchanged capture but still rebuilds and runs the suite, so it needs
      # the toolchain exactly when a moved-capture run does.
      - name: Install the test toolchain
        if: steps.capture.outputs.proceed == 'true'
        # There is deliberately no `pip install --upgrade pip` here: the
        # runner's stock pip installs the pinned manifest, so the unreviewed
        # upgrade would be the one unpinned install in the job (issue #141).
        run: |
          python3 -m pip install -r requirements-test.txt

      - name: Install Chromium for playwright
        if: steps.capture.outputs.proceed == 'true'
        # The browser binary is not a pip package, and playwright's own
        # installer performs no integrity check: browsers.json publishes no
        # digest and the installer never hashes a byte, so a bare install
        # executes whatever the CDN hands over. scripts/ci/install_chromium.py
        # verifies every archive against a committed sha256 first, pre-seeds
        # the browsers directory so playwright's install has nothing left to
        # download, and fails the run if anything was re-downloaded anyway.
        # The verification keeps its point under the artifact split (issue
        # #143): the browser produces the V8 coverage dump in tests.yml, and
        # here it produces the page the suite verifies -- nothing a read-only
        # job builds can touch main or the hub.
        run: python3 scripts/ci/install_chromium.py

      - name: Summarise what changed
        # Runs on `proceed`, not `changed`: this is the ONLY step that executes
        # diff_aa.py, so gating it on the data moving meant a forced run could
        # go green while the differ was broken -- which is exactly how a
        # KeyError on a removed field reached main.
        if: steps.capture.outputs.proceed == 'true'
        # Both paths compare the committed capture against the one just
        # fetched. The paths are passed EXPLICITLY AND RELATIVELY: the defaults
        # are absolute, and an absolute runner path (/home/runner/work/...)
        # baked into a commit message is permanent noise.
        #
        # The run log gets the full report; the commit gets the same report
        # under a subject line naming what moved. The speed section is already
        # threshold-filtered and unchanged frontier sections are omitted at
        # the source, so the commit carries everything that is news.
        env:
          CHANGED: ${{ steps.capture.outputs.changed }}
        run: |
          python3 scripts/diff_aa.py git:HEAD data/aa-raw-models.json > diff.txt
          # Only a run whose DATA moved gets diff_aa's message; a forced
          # build-only run writes its own in the write job's commit step.
          if [ "$CHANGED" = true ]; then
            python3 scripts/diff_aa.py git:HEAD data/aa-raw-models.json \
              --commit-msg > commit-msg.txt
          fi
          {
            echo '### What moved'
            echo
            echo '```'
            cat diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild the page
        if: steps.capture.outputs.proceed == 'true'
        # The page prints the SHA of the tree it was actually built from
        # (only when this is set). When the write job's push races and the
        # rebase lands the same build in a later commit, the printed SHA
        # still names the build's source — that is the honest claim.
        env:
          AA_SOURCE_COMMIT: ${{ github.sha }}
        run: python3 build.py

      - name: Run the suite against the new capture
        if: steps.capture.outputs.proceed == 'true'
        # The suite's browser tests rebuild the page over the REAL
        # out/frontier-models.html (tests/test_browser.py's setUpClass calls
        # build.main()), so this step must carry the same env the Rebuild
        # step has: unstamped, that rewrite would throw the stamp away and
        # the payload would ship an unstamped page (issue #92).
        env:
          AA_SOURCE_COMMIT: ${{ github.sha }}
        run: python3 -m pytest -q -ra

      - name: Stage the publish payload
        # The hour's write side, packed: the staging step is what turns a
        # verified tree into the artifact the publish job consumes. It runs
        # on `proceed` -- a heal run packs too (the hub may be behind even
        # when the capture is quiet) -- and its stamp-churn guard is the old
        # commit step's, moved wholesale.
        if: steps.capture.outputs.proceed == 'true'
        env:
          CHANGED: ${{ steps.capture.outputs.changed }}
          FORCE: ${{ inputs.force }}
          RETIRE: ${{ steps.fetch.outputs.retire }}
        run: |
          PAYLOAD="${RUNNER_TEMP}/publish-payload"
          mkdir -p "${PAYLOAD}/tree"
          # Issue #94's stamp-churn guard, moved from the old commit step: on
          # a heal run the rebuilt page is stamped with THIS run's sha -- the
          # only thing that differs from HEAD's page -- so restore HEAD's page
          # before it ships; a forced run may commit stamp churn, accepted
          # because force is manual and rare.
          if [ "$CHANGED" != "true" ] && [ "$FORCE" != "true" ]; then
            git show HEAD:out/frontier-models.html > out/frontier-models.html
          fi
          # The fixed add list the old commit stage staged: unchanged files
          # copy fine -- the write job's `git add` stages only what differs
          # from main.
          for p in data/aa-raw-models.json data/aa-raw-coding-agents.json \
                   data/captured-at.txt out/frontier-models.html; do
            cp --parents "$p" "${PAYLOAD}/tree/"
          done
          # The window files ride the data commit when the hour opens or
          # continues a window (untracked-new or tracked-refreshed). When the
          # hour RETIRES the window (rc 0 + tracked), they do not ship:
          # shipping what the retirement commit removes would resurrect it.
          if [ "$RETIRE" = "true" ]; then
            printf '%s\n' data/aa-disagreement-snapshot.json data/aa-route-disagreement.txt \
              > "${PAYLOAD}/remove.txt"
          else
            [ ! -f data/aa-disagreement-snapshot.json ] || cp --parents data/aa-disagreement-snapshot.json "${PAYLOAD}/tree/"
            [ ! -f data/aa-route-disagreement.txt ] || cp --parents data/aa-route-disagreement.txt "${PAYLOAD}/tree/"
          fi
          # The differ's message travels when the hour ran it (CHANGED=true);
          # the write job's message selection reads it exactly as the old
          # commit step read the workspace copy.
          [ ! -f commit-msg.txt ] || cp commit-msg.txt "${PAYLOAD}/commit-msg.txt"

      - name: Upload the publish payload
        # An explicit `if` REPLACES the implicit success() gate, so success()
        # is restated: a red suite must not hand a payload to the writer.
        if: success() && steps.capture.outputs.proceed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-payload
          path: ${{ runner.temp }}/publish-payload
          if-no-files-found: error

  # --- The write half: commit and publish, no repository code --------------
  # Issue #143: the job that runs the capture, installs unhashed third-party
  # dependencies and downloads a browser must not hold a write token while it
  # does. This job is the workflow's only writer: it holds contents:write and
  # the docs-hub credential, downloads this same run's payload (needs:, not a
  # workflow_run -- there is no cross-run trust question), and runs no
  # repository code: no checkout, no pip, no browser, no script from the
  # tree -- git plumbing against a scratch repo, curl against the pinned hub
  # host, and the GitHub API for the published ref. A pull request never
  # reaches it: this workflow has no pull_request trigger, and the job needs
  # a successful refresh run that said proceed.
  publish:
    name: Commit and publish the capture
    runs-on: ubuntu-latest

    # Per-job ceiling, like every other job's: a hung push or upload fails
    # in 15 minutes instead of holding GitHub's 6-hour default.
    timeout-minutes: 15

    needs: refresh

    # The writer runs only behind a successful, proceeding refresh job: a red
    # capture or a red suite must still produce NO commit and NO publish, and
    # a quiet hour means the writer has nothing to do.
    if: >-
      needs.refresh.result == 'success' &&
      needs.refresh.outputs.proceed == 'true'

    permissions:
      # The only writer in this workflow, and it runs no repository code:
      # everything it commits or uploads is the artifact of its own run's
      # refresh job, which the suite verified.
      contents: write

    steps:
      - name: Download the publish payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publish-payload
          path: ${{ runner.temp }}/publish-payload

      - name: Commit the capture
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          PAYLOAD="${RUNNER_TEMP}/publish-payload"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}"
          scratch="${RUNNER_TEMP}/scratch"
          # Scratch repo at main's tip: git plumbing only, nothing executed
          # from the tree. The remote carries the token in its URL, so it
          # sits in this scratch's .git/config -- under RUNNER_TEMP,
          # ephemeral, created and torn down inside this one step of this
          # one job, and this job checks out and executes nothing from the
          # tree. (Reviewed on PR #151: the old wording claimed the token
          # never sat in a config; the remote add has always persisted it.)
          git init -q "${scratch}"
          git -C "${scratch}" remote add origin "${remote}"
          git -C "${scratch}" fetch --quiet origin main
          git -C "${scratch}" checkout -q -B push FETCH_HEAD
          git -C "${scratch}" config user.name 'github-actions[bot]'
          git -C "${scratch}" config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          cd "${scratch}"
          # Phase 1 -- the window retirement (issues #100/#118). Applied only
          # when it still bites: if a concurrent run already retired the
          # window on a moved main, the staged removal is empty and the
          # notice records it (the old inline path reached the same end
          # state by rebase-dropping an empty commit).
          if [ -f "${PAYLOAD}/remove.txt" ]; then
            xargs git rm -q --ignore-unmatch < "${PAYLOAD}/remove.txt"
            if git diff --cached --quiet; then
              echo "::notice::The window files are already gone from main; nothing to retire." \
                >> "$GITHUB_STEP_SUMMARY"
            else
              git commit -q -m 'Route agreement restored; resume captures (issue #100)'
              if ! git push origin HEAD:main; then
                git fetch --quiet origin main
                if git rebase origin/main; then
                  # Second rejection concedes SILENTLY: the next
                  # successful capture retires the stamp again.
                  git push origin HEAD:main || true
                else
                  git rebase --abort
                fi
              fi
            fi
          fi
          # Phase 2 -- the hour's data commit, staged over main's tip in the
          # scratch and pushed with the same two-attempt race handling the
          # old single job ran: a rejected push is a race, not a failure.
          # The fixed add list is the old commit step's, verbatim.
          cp -a "${PAYLOAD}/tree/." ./
          git add data/aa-raw-models.json data/aa-raw-coding-agents.json \
                  data/captured-at.txt out/frontier-models.html
          [ ! -f data/aa-disagreement-snapshot.json ] || git add data/aa-disagreement-snapshot.json
          [ ! -f data/aa-route-disagreement.txt ] || git add data/aa-route-disagreement.txt
          # The message is diff_aa.py's own rendering, subject line included —
          # not truncated here. A long one means a lot genuinely moved, and
          # that is the day you want the detail. A run with an unchanged
          # capture never ran the differ, so it writes its own subject.
          # A commit that adds the disagreement snapshot is a DISPUTED
          # publish (issue #118): its message names that and carries the
          # capture's own divergence diagnostic from the stamp, never the
          # differ's "nothing moved" rendering (the differ compares the
          # last-good captures, which a window does not touch).
          if git diff --cached --name-only | grep -q '^data/aa-disagreement-snapshot\.json$'; then
            printf '%s\n\n%s\n' \
              'Publish disputed capture: AA routes disagree (issue #118)' \
              'Both routes'"'"' raw payloads and the disagreement map are committed as data/aa-disagreement-snapshot.json; the page renders the disputed layer until the routes agree again.' \
              > "${RUNNER_TEMP}/commit-msg.txt"
            sed -n '2,$p' data/aa-route-disagreement.txt >> "${RUNNER_TEMP}/commit-msg.txt"
          elif [ -f "${PAYLOAD}/commit-msg.txt" ]; then
            # Route the differ's message into the file the commit below
            # reads -- every branch of this selection must leave THAT file
            # written (review C1 on PR #151: the append used to land on the
            # payload copy, and every ordinary moved-capture hour died at
            # the commit, exit 128).
            cat "${PAYLOAD}/commit-msg.txt" > "${RUNNER_TEMP}/commit-msg.txt"
            printf '\n%s\n' 'Captured by .github/workflows/refresh.yml.' \
              >> "${RUNNER_TEMP}/commit-msg.txt"
          else
            printf '%s\n\n%s\n' \
              'Rebuild the page: forced run, AA capture unchanged' \
              'The build moved, the data did not. Republished so the live page matches main.' \
              > "${RUNNER_TEMP}/commit-msg.txt"
          fi
          # A quiet run stages nothing here (the gate restored data/ in the
          # refresh job and the staging step's guard restored the page), and
          # a forced run can produce a page identical to HEAD's; committing
          # nothing is the correct outcome, and `git commit` would fail on
          # it. The publish still happens (publish=true): this is exactly
          # the shape of a heal run, where the page to serve is HEAD's but
          # the hub is behind it.
          if git diff --cached --quiet; then
            echo "Staged tree matches main's tip — nothing committed." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -F "${RUNNER_TEMP}/commit-msg.txt"
          # No co-author trailer: no model authored this commit. A refresh that
          # a person or an agent drives by hand still carries one.
          #
          # The push races a concurrent run of this same workflow: the
          # concurrency group serializes jobs, but two runs can still pass
          # each other between their checks and their pushes (observed
          # 2026-09-28, runs 287/288, seven seconds apart; the loser died on
          # a non-fast-forward rejection). A rejection is a race, not a
          # failure: fetch the moved main, rebase, push once more. The retry
          # is the FINAL attempt -- a second rejection fails the run red
          # rather than looping.
          if ! git push origin HEAD:main; then
            # Anonymous fetch (the repo is public); on a private repo this
            # fetch fails the run red rather than skipping the retry. The
            # pushes themselves authenticate via the token URL remote.
            git fetch --quiet origin main
            if ! git rebase origin/main; then
              # A conflict means the concurrent run pushed a different
              # capture for the same hour -- the capture files are what
              # both commits touch, so they collide. Concede: the
              # concurrent run's capture stands, and publishing it is that
              # run's job. Green, publishes nothing.
              git rebase --abort
              {
                echo 'Lost the race: a concurrent refresh run pushed first, and its capture stands.'
                echo 'Nothing committed or published by this run.'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # The suite is not re-run over the rebased commit: a conflict-
            # free rebase means the concurrent commit edited different
            # regions than ours -- same-region edits to the page would have
            # conflicted -- so the rebased commit is overwhelmingly the page
            # this suite run passed. The retry below is the final attempt;
            # if it succeeds over a main that moved by a build-code commit,
            # the documented force-input contract covers the staleness and
            # the next moved-data run heals it.
            git push origin HEAD:main
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish to docs-hub
        # Two gates: the job-level `if` says this run has something to
        # publish, and the commit step's own verdict says a publishable
        # state was actually reached. Both must hold — a green run that
        # conceded the push race must not republish anything.
        if: steps.commit.outputs.publish == 'true'
        env:
          DOCS_HUB_API_KEY: ${{ secrets.DOCS_HUB_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The compare-and-abort gate (issue #74). Two overlapping runs can
          # both reach this step, and if the OLDER run's upload lands after
          # the newer run's, the hub serves the older page while the
          # `published` ref records the newer commit — an inversion the heal
          # gate's ref comparison cannot see (the ref agrees with HEAD; the
          # HUB is what is behind). So the upload itself is gated: fresh-
          # fetch the ref anonymously (same shape as the heal gate's fetch),
          # and when the tip is not already this run's HEAD, ask the compare
          # API. Its status names the TIP side relative to the BASE side:
          # `behind` — the tip is an ancestor of this run's HEAD, the normal
          # heal situation — publishes; `ahead` — the tip is a descendant, a
          # newer run already published — ABORTS green: a summary line, no
          # upload, no ref move, exit 0. The newest run NEVER aborts, so
          # within any overlap the newest page always wins; the abort only
          # stops the older run from regressing the hub afterwards. A missing
          # ref means nothing was ever published; anything else, or a failed
          # API call retried once, publishes anyway with a warning —
          # availability of publish beats the residual seconds-wide window,
          # which the heal gate's hub check then heals within one run.
          cd "${RUNNER_TEMP}/scratch"
          if git fetch --depth=1 origin \
               refs/heads/published:refs/remotes/origin/published 2>/dev/null; then
            tip="$(git rev-parse origin/published)"
            mine="$(git rev-parse HEAD)"
            if [ "$tip" != "$mine" ]; then
              status=""
              for _ in 1 2; do
                status="$(gh api "repos/$REPO/compare/$mine...$tip" --jq .status)" || status=""
                case "$status" in
                  ahead|behind|identical) break ;;
                  *) status="" ;;
                esac
              done
              if [ "$status" = ahead ]; then
                echo "A newer refresh run already published: the published ref names a commit past this run's HEAD — nothing uploaded, no ref moved." \
                  >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              if [ -z "$status" ]; then
                echo "WARNING: the compare API could not rank refs/heads/published against this run's HEAD; publishing anyway." \
                  >> "$GITHUB_STEP_SUMMARY"
              fi
              # `behind` (or `identical`, a ref that moved to exactly this
              # HEAD while the gate ran) is the normal heal: fall through to
              # the upload.
            fi
          fi
          # The upload. The write job runs no repository code, so this is
          # the endpoint's wire format inlined -- scripts/publish_docs.py is
          # the canonical client and the mirror source: keep the two in
          # sync. The key travels in a header, never an argument; the URL
          # is a literal on the pinned hub host -- the same host-pinning
          # rule publish_docs.py enforces in code -- so the credential can
          # only ever be sent there.
          code="$(curl -sS --connect-timeout 10 --max-time 120 \
            -o /tmp/publish-response.json -w '%{http_code}' \
            -H "x-docs-key: ${DOCS_HUB_API_KEY}" \
            -F 'slug=ai-researcher/frontier-models' \
            -F 'title=Frontier models — intelligence vs cost per task' \
            -F 'tags=benchmarks,comparison,interactive,ai' \
            -F 'project=ai-researcher' \
            -F 'from=ai-researcher' \
            -F 'file=@out/frontier-models.html;type=text/html' \
            https://docs.nitjsefni.eu/api/publish)"
          # No --fail on curl: the status is captured and branched on
          # explicitly, so the hub's refusal body reaches the log the way
          # publish_docs.py surfaced it (review M2 on PR #151). A transport
          # failure still kills the step under bash -e before the verdict.
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "publish failed: HTTP ${code}:" >&2
            cat /tmp/publish-response.json >&2
            exit 1
          fi
          # A 2xx carrying an error field is still a failure -- the hub uses
          # both, the same verdict publish_docs.py computes for the hub's
          # answers.
          if jq -e '(.error // null) != null' /tmp/publish-response.json > /dev/null; then
            echo "publish failed: HTTP ${code} with an error field:" >&2
            cat /tmp/publish-response.json >&2
            exit 1
          fi
          cat /tmp/publish-response.json
          # Record the published state only once the upload succeeded: this
          # ref is what the heal gate compares against, so it must never
          # claim a page the hub does not serve. HEAD sits on main's history
          # and the ref only ever moves along it, so the update is always a
          # fast-forward.
          #
          # The ref moves through the GitHub refs API, not `git push`: the
          # scratch fetch is --depth=1, so git holds too little ancestry to
          # prove a fast-forward locally and would be rejected with "(fetch
          # first)" even though it was one -- issue #77. The API checks
          # server-side, where the full graph lives:
          #   - GET first: the shell branches on the GET's exit code, so a
          #     404 -- or ANY failed GET -- routes to CREATE (POST); a POST
          #     against an existing ref fails there with 422 "already
          #     exists", so a transient GET error cannot mis-create.
          #   - Otherwise PATCH without `force`: the API default is the
          #     server-side fast-forward check, and a 422 "not a fast
          #     forward" fails the run -- the same red a rejected push
          #     produced, now only when the update genuinely is not a
          #     fast-forward.
          # Any other API failure fails the run too: a silently stale ref
          # would make every later hour republish.
          head_sha="$(git rev-parse HEAD)"
          # Issue #152: the ref must only ever name a commit on main's
          # history. A quiet hour whose retirement push lost the race ends
          # with HEAD at an unpushed retirement commit -- the PATCH's
          # fast-forward check would accept it and the ref would leave
          # main's history. So the move is gated on HEAD actually being an
          # ancestor of (or equal to) main's tip, fresh-fetched after the
          # upload: off main, the move is skipped green -- the ref stays at
          # main's last real commit, exactly what the heal gate compares
          # against, and the next hour whose commit lands moves it forward.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${head_sha}" FETCH_HEAD; then
            echo "The published ref stays where it is: this run's HEAD is not on main's history (a lost retirement push) — the upload stands, the ref moves when a landing commit is the tip." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh api "repos/$REPO/git/refs/heads/published" > /dev/null; then
            gh api --method PATCH "repos/$REPO/git/refs/heads/published" \
              -f sha="$head_sha"
          else
            gh api --method POST "repos/$REPO/git/refs/heads/published" \
              -f ref=refs/heads/published -f sha="$head_sha"
          fi
