name: types

# Type gate: pyright at `basic` — strict on an existing codebase produces
# noise that gets ignored, which is worse than no check. Config is checked in
# (pyrightconfig.json) so CI and every editor use the same settings.

on:
  workflow_call:
  workflow_dispatch:
    # Standalone dispatch runs (no ci-gate classification) run every job
    # unconditionally.

# Trigger ownership moved to ci-gate.yml (issue #133): the push and
# pull_request triggers, and their paths-ignore deny-list
# (`**/*.md` / LICENSE / .gitignore), live there now — a trigger filter
# cannot report, so a required-check ruleset could never go green on a
# documentation-only change. ci-gate classifies the changed paths and
# conditions this leg on the result.

permissions:
  contents: read

concurrency:
  group: types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pyright:
    runs-on: ubuntu-latest
    # A hung job fails in 15 minutes instead of holding GitHub's 6-hour
    # default.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install pyright
        # There is deliberately no `pip install --upgrade pip` here: the
        # runner's stock pip installs the pinned manifests, so the unreviewed
        # upgrade would be the one unpinned install in the job (issue #141).
        run: |
          # requirements-test.txt too, or pyright cannot resolve playwright in
          # tests/test_browser.py and reports it as an error. The runtime is
          # stdlib, so these two files ARE the whole set of third-party names
          # pyright needs to know about.
          python3 -m pip install -r requirements-dev.txt -r requirements-test.txt

      - name: pyright
        run: python3 -m pyright
