name: size baseline

# workflow_call-only: mode: auto fails closed on any other event; ci-gate
# owns the trigger surface (issue #333).

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: size-baseline-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  size-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: Nitjsefnie-Actions/size-ratchet@0c9790acfe6bec19f1310a6e17428332185ea3ec # v1.1.0
        with:
          records: '.github/size-baseline.json'
          mode: 'auto'
          base-ref: ${{ github.event.pull_request.base.sha }}
      - name: Stage tightened records
        id: stage
        if: github.event_name == 'push'
        env:
          AI_RESEARCHER_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          original="${RUNNER_TEMP}/size-baseline-original.json"
          git show "${AI_RESEARCHER_HEAD_SHA}:.github/size-baseline.json" > "$original"
          if cmp -s "$original" .github/size-baseline.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          data="${RUNNER_TEMP}/size-baseline-data"
          mkdir -p "$data"
          cp .github/size-baseline.json "$data/size-baseline.json"
          printf '%s\n' "$AI_RESEARCHER_HEAD_SHA" > "$data/base.txt"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Upload tightened records
        if: github.event_name == 'push' && steps.stage.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-baseline-data
          path: ${{ runner.temp }}/size-baseline-data
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 1
