# Every dependency in this repo is pinned to an exact version, deliberately: a
# tool release must never turn CI red on an unchanged commit. The cost of that
# choice is that pins go stale silently, and a stale pin is how a fixed CVE
# stays exploitable. Dependabot pays that cost back — it is the counterpart to
# audit.yml, which detects the problem but cannot fix it.

version: 2
updates:
  # requirements-dev.txt (lint/type toolchain), requirements-test.txt
  # (pytest, coverage, playwright), requirements-zizmor.txt and
  # requirements-pip-audit.txt (the two gate tools, installed by
  # actionlint.yml and audit.yml — they became requirements files precisely
  # so this entry can bump them, issue #50). There is no runtime entry:
  # build.py and the scripts import nothing off PyPI, so these tool pins are
  # the entire pip surface.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies

  # The workflows pin every action to a commit SHA with the version in a
  # trailing comment. A SHA pin does not move at all — which is the point,
  # since these jobs run with a repository token — and it is also why this
  # entry is not optional: without Dependabot a SHA pin is frozen forever. It
  # rewrites both the SHA and the comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    # github/codeql-action/init and .../analyze are separate dependencies to
    # Dependabot, so ungrouped it files ONE HALF-BUMP PR PER PIN — and a tree
    # whose init and analyze pins disagree fails every CodeQL run at SARIF
    # processing with "Loaded a configuration file for version 'X', but
    # running version 'Y'" (issue #45: every action-pin bump PR since 4.37.7
    # went red). The groups are what keep both pins in one atomic PR; the
    # in-tree tripwire is tests/test_ci_workflows.py.
    #
    # A group without `applies-to` covers version updates only, and security
    # updates are enabled on this repository — so without the mirror group
    # below, a security bump to codeql-action still arrived as one PR per
    # `uses:` line, splitting init from analyze across SHAs (issue #132).
    # Shaped like the security group in Nitjsefnie-Actions/claim (claim#37)
    # and Nitjsefnie-Actions/pr-gate (pr-gate#23).
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
