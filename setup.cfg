[pycodestyle]
# Style opinions are not the point of this gate — real defects are. build.py
# holds wide data tables and long SVG/HTML string literals that wrap worse
# than they read.
max-line-length = 10000

# pycodestyle's `ignore` REPLACES its default list rather than extending it,
# so the defaults are restated here. The only addition is E203: it fires on
# `text[start : j + 1]` in fetch_aa.py, where the space is the slice spacing
# every formatter emits and PEP 8 itself recommends for compound expressions.
ignore = E121,E123,E126,E226,E24,E704,W503,W504,E203

exclude = .venv, .pytest_cache, .benchmarks, __pycache__, out
